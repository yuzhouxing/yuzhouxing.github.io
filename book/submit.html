<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贡献史料 - KIOMET 编年史</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .submitter-section {
            background: #e8f5e8;
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
            border-left: 4px solid #4caf50;
        }
        
        .submitter-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .submitter-name {
            font-weight: bold;
            color: #2e7d32;
        }
        
        .change-submitter-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .submitter-input {
            display: flex;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        
        .submitter-input input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .submitter-input button {
            padding: 0.5rem 1rem;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .date-error {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .date-examples {
            background: #f8f9fa;
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="submit-body">
    <div class="submit-container">
        <h1>📜 为编年史贡献史料</h1>
        <p class="description">在此提交KIOMET世界中的重大事件，审核通过后将载入史册</p>

        <!-- 提交者信息区域 -->
        <div class="submitter-section">
            <h3>👤 提交者信息</h3>
            <div id="submitterDisplay">
                <div class="submitter-info">
                    <span>当前提交者：<span id="currentSubmitter" class="submitter-name">请设置您的名字</span></span>
                    <button onclick="changeSubmitter()" class="change-submitter-btn">更改名字</button>
                </div>
                <small>您的名字将永久记录在历史事件中</small>
            </div>
            
            <div id="submitterInput" style="display: none;">
                <div class="submitter-input">
                    <input type="text" id="newSubmitterName" placeholder="请输入您的名字">
                    <button type="button" onclick="saveSubmitter()">保存</button>
                    <button type="button" onclick="cancelChangeSubmitter()" style="background: #666;">取消</button>
                </div>
            </div>
        </div>

        <form id="eventForm">
            <div class="form-group">
                <label for="date">🗓️ 历史日期：</label>
                <input type="text" id="date" name="date" required 
                       placeholder="例如：2025.3 或 2025.3.18"
                       oninput="validateDate(this)">
                <div id="dateError" class="date-error"></div>
                <small>请使用标准格式：YYYY.M 或 YYYY.M.D</small>
                <div class="date-examples">
                    📋 正确示例：2025.3、2025.3.18、2025.12、2025.12.1<br>
                    ❌ 错误示例：2025年3月、2025/3/18、2025-3-18
                </div>
            </div>

            <div class="form-group">
                <label for="title">🏷️ 事件标题：</label>
                <input type="text" id="title" name="title" required placeholder="无">
            </div>

            <div class="form-group">
                <label for="faction">⚔️ 涉及联盟/势力：</label>
                <input type="text" id="faction" name="faction" required placeholder="例如：XX联盟、公共、多方势力">
            </div>

            <div class="form-group">
                <label for="content">📖 事件详情：</label>
                <textarea id="content" name="content" rows="6" required placeholder="请详细描述事件的经过、影响和意义..."></textarea>
            </div>

            <div class="form-group">
                <label for="evidence_url">🔗 证据链接（可选）：</label>
                <input type="url" id="evidence_url" name="evidence_url" placeholder="https://...（截图、战报视频链接等）">
                <small>请提供可靠的证据来源</small>
            </div>

            <div class="form-actions">
                <button type="submit" id="submitButton" class="submit-btn">🚀 提交审核</button>
            </div>
        </form>

        <div id="formMessage" class="message"></div>

        <div class="navigation">
            <a href="index.html">🏠 返回首页</a>
            <a href="timeline.html">📖 查看史书</a>
            <a href="hall-of-fame.html">🏆 贡献榜</a>
            <a href="stats.html">📊 数据统计</a>
        </div>
    </div>

    <!-- 先引入Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js"></script>
    <script>
        // Supabase配置 - 使用正确的初始化方式
        const SUPABASE_URL = 'https://exvsmuoyxmpnnaocoxie.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4dnNtdW95eG1wbm5hb2NveGllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1NTY5MTQsImV4cCI6MjA3MjEzMjkxNH0.0tcoiCMaIMI7tdu_Zajg0Dq4kp_qnG-K4r1Ak89g6JM';
        const SUBMITTER_STORAGE_KEY = 'kiomet_submitter_name';
        
        // 正确的Supabase初始化方式
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('Supabase客户端已初始化');
        
        let currentSubmitter = '';

        // 日期验证函数
        function validateDate(input) {
            const errorDiv = document.getElementById('dateError');
            const value = input.value.trim();
            
            if (!value) {
                errorDiv.style.display = 'none';
                input.setCustomValidity('');
                return true;
            }
            
            // 严格的日期格式验证：YYYY.M 或 YYYY.M.D
            const isValid = /^20[2-9][0-9]\.(1[0-2]|[1-9])(\.(3[01]|[12][0-9]|[1-9]))?$/.test(value);
            
            if (!isValid) {
                errorDiv.textContent = '请使用正确格式：YYYY.M 或 YYYY.M.D（如：2025.3 或 2025.3.18）';
                errorDiv.style.display = 'block';
                input.setCustomValidity('日期格式不正确');
                return false;
            }
            
            // 验证日期是否合理
            const parts = value.split('.');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            let day = parts.length > 2 ? parseInt(parts[2]) : 0;
            
            // 检查月份是否有效
            if (month < 1 || month > 12) {
                errorDiv.textContent = '月份必须在1-12之间';
                errorDiv.style.display = 'block';
                input.setCustomValidity('月份无效');
                return false;
            }
            
            // 检查日期是否有效（如果有日期部分）
            if (day > 0) {
                const daysInMonth = new Date(year, month, 0).getDate();
                if (day < 1 || day > daysInMonth) {
                    errorDiv.textContent = `日期无效，${year}年${month}月只有${daysInMonth}天`;
                    errorDiv.style.display = 'block';
                    input.setCustomValidity('日期无效');
                    return false;
                }
            }
            
            errorDiv.style.display = 'none';
            input.setCustomValidity('');
            return true;
        }

        // 将文本日期转换为标准ISO日期格式
        function parseDateToISO(dateText) {
            const parts = dateText.split('.');
            const year = parts[0];
            const month = parts[1].padStart(2, '0');
            
            if (parts.length === 2) {
                // YYYY.M 格式，设置为该月第一天
                return `${year}-${month}-01`;
            } else if (parts.length === 3) {
                // YYYY.M.D 格式
                const day = parts[2].padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            return null;
        }

        // 初始化提交者信息
        function initSubmitter() {
            const savedName = localStorage.getItem(SUBMITTER_STORAGE_KEY);
            console.log('从localStorage获取的名字:', savedName);
            
            if (savedName) {
                currentSubmitter = savedName;
                updateSubmitterDisplay();
            } else {
                // 第一次使用，直接显示输入框
                showSubmitterInput();
            }
        }

        // 更新提交者显示
        function updateSubmitterDisplay() {
            console.log('更新显示，当前提交者:', currentSubmitter);
            document.getElementById('currentSubmitter').textContent = currentSubmitter;
            document.getElementById('submitterDisplay').style.display = 'block';
            document.getElementById('submitterInput').style.display = 'none';
        }

        // 显示提交者输入框
        function showSubmitterInput() {
            console.log('显示输入框');
            document.getElementById('submitterDisplay').style.display = 'none';
            document.getElementById('submitterInput').style.display = 'block';
            document.getElementById('newSubmitterName').value = currentSubmitter || '';
            document.getElementById('newSubmitterName').focus();
        }

        // 更改提交者名字
        function changeSubmitter() {
            console.log('更改提交者');
            showSubmitterInput();
        }

        // 保存提交者名字
        function saveSubmitter() {
            console.log('保存提交者');
            const newName = document.getElementById('newSubmitterName').value.trim();
            console.log('输入的名字:', newName);
            
            if (!newName) {
                alert('请输入有效的名字');
                return;
            }
            
            currentSubmitter = newName;
            localStorage.setItem(SUBMITTER_STORAGE_KEY, currentSubmitter);
            console.log('已保存到localStorage:', currentSubmitter);
            
            updateSubmitterDisplay();
            alert(`提交者名字已设置为: ${currentSubmitter}`);
        }

        // 取消更改提交者名字
        function cancelChangeSubmitter() {
            console.log('取消更改');
            const savedName = localStorage.getItem(SUBMITTER_STORAGE_KEY);
            
            if (savedName) {
                currentSubmitter = savedName;
                updateSubmitterDisplay();
            } else {
                // 如果还没有设置过名字，保持显示输入框
                showSubmitterInput();
            }
        }

        // 表单提交处理
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 检查是否设置了提交者名字
            if (!currentSubmitter) {
                alert('请先设置提交者名字');
                showSubmitterInput();
                return;
            }
            
            // 验证日期格式
            const dateInput = document.getElementById('date');
            const dateValue = dateInput.value.trim();
            if (!validateDate(dateInput)) {
                alert('请使用正确的日期格式：YYYY.M 或 YYYY.M.D');
                dateInput.focus();
                return;
            }
            
            const submitButton = document.getElementById('submitButton');
            const formData = new FormData(e.target);
            const eventData = Object.fromEntries(formData.entries());

            // 添加提交者信息和审核状态
            eventData.submitted_by = currentSubmitter;
            eventData.approved = false;
            
            // 添加标准化日期字段用于排序
            eventData.event_date = parseDateToISO(dateValue);

            submitButton.disabled = true;
            submitButton.textContent = '提交中...';
            
            const messageEl = document.getElementById('formMessage');
            messageEl.textContent = '🔄 正在提交，请稍候...';
            messageEl.className = 'message info';

            console.log('准备提交的数据:', eventData);

            try {
                const { data, error } = await supabase
                    .from('events')
                    .insert([eventData])
                    .select();

                console.log('Supabase响应:', { data, error });

                if (error) {
                    throw new Error(`数据库错误: ${error.message} (代码: ${error.code})`);
                }

                if (data && data.length > 0) {
                    messageEl.textContent = '✅ 成功提交！等待管理员审核后将会出现在史书中。';
                    messageEl.className = 'message success';
                    e.target.reset();
                    
                    // 显示成功提交的数据详情
                    console.log('成功提交的数据:', data[0]);
                } else {
                    throw new Error('服务器返回空数据，可能插入失败');
                }

            } catch (error) {
                console.error('提交错误:', error);
                messageEl.textContent = `提交失败: ${error.message}`;
                messageEl.className = 'message error';
                
                // 显示详细的错误信息
                if (error.message.includes('JWT')) {
                    messageEl.innerHTML += '<br>❌ API密钥配置错误';
                } else if (error.message.includes('CORS')) {
                    messageEl.innerHTML += '<br>❌ 跨域问题，请检查CORS设置';
                } else if (error.message.includes('network')) {
                    messageEl.innerHTML += '<br>❌ 网络连接问题';
                }
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = '🚀 提交审核';
            }
        });

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，初始化提交者系统');
            console.log('Supabase客户端状态:', window.supabase ? '已加载' : '未加载');
            initSubmitter();
            
            // 为日期输入框添加实时验证
            document.getElementById('date').addEventListener('blur', function() {
                validateDate(this);
            });
        });
    </script>
</body>
</html>
