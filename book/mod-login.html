<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核员登录 - MK48/49 编年史</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .login-btn {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
            text-align: center;
            display: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 6px;
            margin: 1rem 0;
            text-align: center;
            display: none;
        }
        .navigation {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            border-top: 1px solid #e0d6cc;
            padding-top: 1.5rem;
        }
        .navigation a {
            color: #6b5b4b;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .navigation a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="submit-body">
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 审核员登录</h1>
            <p>请输入您的审核密钥以管理事件</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="secretKey">审核密钥：</label>
                <input type="password" id="secretKey" required
                       placeholder="请输入您的审核密钥">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                登录审核系统
            </button>
        </form>

        <div class="navigation">
            <a href="index.html">🏠 返回首页</a>
            <a href="timeline.html">📖 查看编年史</a>
            <a href="submit.html">📝 贡献史料</a>
            <a href="hall-of-fame.html">🏆 贡献榜</a>
            <a href="stats.html">📊 数据统计</a>
            <a href="graph.html">🌐 势力关系图</a>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js">
    </script>
    <script>
        // ============================================================
        //  MK48/49 编年史 · Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://rjstjmxwizfxrgrwgyab.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqc3RqbXh3aXpmeHJncndneWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjAxODgsImV4cCI6MjA5OTU5NjE4OH0.m44t35UhOjRuRAUB9qMiIn-1enGk3lNCKqjVe_6kPt0';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase 客户端已初始化 (审核登录)');

        // ============================================================
        //  配置
        // ============================================================
        const MODERATOR_STORAGE_KEY = 'mk49_moderator_info';

        // ============================================================
        //  DOM 引用
        // ============================================================
        const form = document.getElementById('loginForm');
        const secretKeyInput = document.getElementById('secretKey');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // ============================================================
        //  UI 辅助函数
        // ============================================================
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // ============================================================
        //  登录逻辑
        // ============================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const secretKey = secretKeyInput.value.trim();

            if (!secretKey) {
                showError('请输入审核密钥');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '验证中...';

            try {
                const { data: moderator, error } = await supabaseClient
                    .from('moderators')
                    .select('id, username')
                    .eq('secret_key', secretKey)
                    .eq('is_active', true)
                    .single();

                if (error) {
                    if (error.code === 'PGRST116') {
                        throw new Error('审核密钥无效或已失效');
                    }
                    throw error;
                }

                if (!moderator) {
                    throw new Error('审核密钥无效');
                }

                // 存储审核员信息
                const moderatorInfo = {
                    id: moderator.id,
                    username: moderator.username,
                    loggedInAt: new Date().toISOString()
                };

                localStorage.setItem(MODERATOR_STORAGE_KEY, JSON.stringify(moderatorInfo));

                showSuccess('✅ 登录成功！正在跳转...');

                setTimeout(() => {
                    window.location.href = 'mod-dashboard.html';
                }, 1200);

            } catch (error) {
                console.error('登录失败:', error);
                showError(error.message || '登录失败，请检查密钥');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录审核系统';
            }
        });

        // ============================================================
        //  检查是否已登录（自动跳转）
        // ============================================================
        function checkExistingLogin() {
            const moderatorInfo = localStorage.getItem(MODERATOR_STORAGE_KEY);
            if (moderatorInfo) {
                try {
                    const parsed = JSON.parse(moderatorInfo);
                    if (parsed.id && parsed.username) {
                        showSuccess('检测到已登录，正在跳转...');
                        setTimeout(() => {
                            window.location.href = 'mod-dashboard.html';
                        }, 1000);
                    }
                } catch (e) {
                    // 数据无效，清除
                    localStorage.removeItem(MODERATOR_STORAGE_KEY);
                }
            }
        }

        // ============================================================
        //  Enter 键快捷登录（已由 form 的 submit 事件自动处理）
        // ============================================================
        secretKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });

        // ============================================================
        //  初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 审核登录页面加载完成');
            checkExistingLogin();
        });
    </script>
</body>
</html>
