<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiomet联盟海报生成器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(to right, #4776E6, #8E54E9);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        
        .input-section {
            flex: 1;
            min-width: 300px;
            padding: 30px;
        }
        
        .preview-section {
            flex: 1;
            min-width: 300px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #8E54E9;
        }
        
        input, textarea {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        input:focus, textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(142, 84, 233, 0.5);
        }
        
        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, #4776E6, #8E54E9);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }
        
        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            background: linear-gradient(to right, #3c6cd5, #8048d1);
        }
        
        .generate-btn:active {
            transform: translateY(0);
        }
        
        .poster {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #4776E6, #8E54E9);
            border-radius: 20px;
            padding: 30px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .poster::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
            transform: rotate(30deg);
        }
        
        .poster-header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }
        
        .poster-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6);
        }
        
        .poster-subtitle {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        
        .poster-content {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
            min-height: 180px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 2;
        }
        
        .poster-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .instructions {
            margin-top: 30px;
            text-align: center;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 400px;
        }
        
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #8E54E9;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .input-section, .preview-section {
                width: 100%;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated {
            animation: fadeIn 0.8s ease-out;
        }
        
        /* 海报页面样式 */
        .poster-page {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        .large-poster {
            max-width: 600px;
            margin: 40px auto;
            transform: scale(1.05);
        }
        
        .download-btn {
            margin-top: 30px;
            padding: 15px 30px;
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        /* 新增海报装饰元素 */
        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
        }
        
        .circle-1 {
            width: 100px;
            height: 100px;
            top: -30px;
            right: -30px;
        }
        
        .circle-2 {
            width: 60px;
            height: 60px;
            bottom: -20px;
            left: -20px;
        }
        
        .circle-3 {
            width: 80px;
            height: 80px;
            bottom: 40px;
            right: 30px;
        }
        
        .shine-effect {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.03) 20%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0.03) 80%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            z-index: 3;
            animation: shine 8s infinite linear;
        }
        
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        
        .alliance-badge {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            font-size: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid white;
        }
        
        .stats-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .members-list {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .member {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            margin: 0 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            font-weight: bold;
            border: 2px solid white;
        }
        
        .pattern-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.1;
            background-image: radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>
    <div class="logo">Kiomet</div>
    
    <div class="container animated" id="input-container">
        <header>
            <h1>联盟海报生成器</h1>
            <p class="subtitle">创建您的专属联盟炫酷介绍海报</p>
        </header>
        
        <div class="content">
            <div class="input-section">
                <div class="form-group">
                    <label for="alliance-name"><i class="fas fa-flag"></i> 联盟名称</label>
                    <input type="text" id="alliance-name" placeholder="输入您的联盟名称">
                </div>
                <div class="form-group">
                    <label for="alliance-description"><i class="fas fa-info-circle"></i> 联盟简介</label>
                    <textarea id="alliance-description" placeholder="输入联盟简介，包括目标、规则、成员要求等信息"></textarea>
                </div>
                <button class="generate-btn" id="generate-btn">
                    <i class="fas fa-magic"></i> 生成炫酷海报
                </button>
            </div>
            
            <div class="preview-section">
                <div class="poster">
                    <div class="decorative-circle circle-1"></div>
                    <div class="decorative-circle circle-2"></div>
                    <div class="decorative-circle circle-3"></div>
                    <div class="shine-effect"></div>
                    <div class="pattern-dots"></div>
                    
                    <div class="poster-header">
                        <div class="alliance-badge">
                            <i class="fas fa-crown"></i>
                        </div>
                        <div class="poster-title" id="poster-title">联盟名称</div>
                        <div class="poster-subtitle">荣耀与力量的象征</div>
                    </div>
                    <div class="poster-content" id="poster-content">
                        在这里输入联盟简介，将会显示在海报上。您可以详细介绍联盟的目标、规则和成员要求等信息。
                    </div>
                    
                    <div class="stats-container">
                        <div class="stat-item">
                            <div class="stat-value">25</div>
                            <div class="stat-label">成员</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">12</div>
                            <div class="stat-label">胜利</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">7</div>
                            <div class="stat-label">排名</div>
                        </div>
                    </div>
                    
                    <div class="poster-footer">
                        强大 · 团结 · 荣耀
                    </div>
                </div>
                
                <div class="instructions">
                    <p><i class="fas fa-lightbulb"></i> 输入联盟信息后点击生成按钮，将跳转到专属海报页面</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container animated poster-page" id="poster-page">
        <button class="back-btn" id="back-btn">
            <i class="fas fa-arrow-left"></i> 返回编辑
        </button>
        
        <header>
            <h1>您的联盟海报</h1>
            <p class="subtitle">保存并分享此海报，吸引更多玩家加入</p>
        </header>
        
        <div class="poster large-poster">
            <div class="decorative-circle circle-1"></div>
            <div class="decorative-circle circle-2"></div>
            <div class="decorative-circle circle-3"></div>
            <div class="shine-effect"></div>
            <div class="pattern-dots"></div>
            
            <div class="poster-header">
                <div class="alliance-badge">
                    <i class="fas fa-crown"></i>
                </div>
                <div class="poster-title" id="final-title">联盟名称</div>
                <div class="poster-subtitle">荣耀与力量的象征</div>
            </div>
            <div class="poster-content" id="final-content">
                在这里输入联盟简介，将会显示在海报上。您可以详细介绍联盟的目标、规则和成员要求等信息。
            </div>
            
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-value">25</div>
                    <div class="stat-label">成员</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">12</div>
                    <div class="stat-label">胜利</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">7</div>
                    <div class="stat-label">排名</div>
                </div>
            </div>
            
            <div class="members-list">
                <div class="member">K</div>
                <div class="member">A</div>
                <div class="member">L</div>
                <div class="member">M</div>
                <div class="member">S</div>
            </div>
            
            <div class="poster-footer">
                强大 · 团结 · 荣耀
            </div>
        </div>
        
        <button class="download-btn" id="download-btn">
            <i class="fas fa-download"></i> 下载海报
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generate-btn');
            const backBtn = document.getElementById('back-btn');
            const downloadBtn = document.getElementById('download-btn');
            const allianceNameInput = document.getElementById('alliance-name');
            const allianceDescInput = document.getElementById('alliance-description');
            const posterTitle = document.getElementById('poster-title');
            const posterContent = document.getElementById('poster-content');
            const finalTitle = document.getElementById('final-title');
            const finalContent = document.getElementById('final-content');
            const inputContainer = document.getElementById('input-container');
            const posterPage = document.getElementById('poster-page');
            
            // 初始显示输入界面，隐藏海报界面
            inputContainer.style.display = 'block';
            posterPage.style.display = 'none';
            
            // 生成海报
            generateBtn.addEventListener('click', function() {
                const name = allianceNameInput.value.trim() || '联盟名称';
                const description = allianceDescInput.value.trim() || '在这里输入联盟简介，将会显示在海报上。您可以详细介绍联盟的目标、规则和成员要求等信息。';
                
                // 更新预览
                posterTitle.textContent = name;
                posterContent.textContent = description;
                
                // 更新最终海报
                finalTitle.textContent = name;
                finalContent.textContent = description;
                
                // 添加动画效果
                generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
                
                setTimeout(() => {
                    // 切换到海报页面
                    inputContainer.style.display = 'none';
                    posterPage.style.display = 'block';
                    generateBtn.innerHTML = '<i class="fas fa-magic"></i> 生成炫酷海报';
                }, 800);
            });
            
            // 返回编辑
            backBtn.addEventListener('click', function() {
                posterPage.style.display = 'none';
                inputContainer.style.display = 'block';
            });
            
            // 下载海报功能
            downloadBtn.addEventListener('click', function() {
                const btn = downloadBtn;
                const originalText = btn.innerHTML;
                
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 准备下载...';
                
                setTimeout(() => {
                    alert('海报下载功能需要引入html2canvas库。在实际部署时，请添加该库以实现完整功能。');
                    btn.innerHTML = originalText;
                }, 1500);
            });
            
            // 初始生成一次预览
            posterTitle.textContent = "联盟名称";
            posterContent.textContent = "在这里输入联盟简介，将会显示在海报上。您可以详细介绍联盟的目标、规则和成员要求等信息。";
            finalTitle.textContent = "联盟名称";
            finalContent.textContent = "在这里输入联盟简介，将会显示在海报上。您可以详细介绍联盟的目标、规则和成员要求等信息。";
        });
    </script>
</body>
</html>
