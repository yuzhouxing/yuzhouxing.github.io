<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiomet进度共享</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2530 0%, #2c3e50 100%);
            color: #ecf0f1;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* 游戏容器 */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e17;
            z-index: 1;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 400px;
            background: rgba(26, 37, 48, 0.97);
            z-index: 900;
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }
        
        .left-sidebar {
            left: 0;
            transform: translateX(-100%);
        }
        
        .left-sidebar.active {
            transform: translateX(0);
        }
        
        /* 浮动按钮 */
        .float-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 800;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            font-size: 20px;
        }
        
        .float-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        
        /* 小部件样式 */
        .widget {
            background: rgba(39, 55, 70, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .widget-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #3498db;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        button {
            background: linear-gradient(to right, #3498db, #2ecc71);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            background: linear-gradient(to right, #2980b9, #27ae60);
        }
        
        button.secondary {
            background: rgba(52, 152, 219, 0.3);
        }
        
        button.secondary:hover {
            background: rgba(52, 152, 219, 0.5);
        }
        
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(26, 37, 48, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #e0e0e0;
            resize: vertical;
            transition: all 0.3s;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        textarea {
            height: 100px;
            font-family: monospace;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(26, 37, 48, 0.5);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #3498db, #2ecc71);
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }
        
        .status {
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }
        
        .status.success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        
        .status.error {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        
        .status.info {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border: 1px solid #3498db;
        }
        
        .status.warning {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid #f39c12;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        
        .data-item:last-child {
            border-bottom: none;
        }
        
        .data-key {
            color: #bdc3c7;
        }
        
        .data-value {
            color: #3498db;
            font-weight: 500;
        }
        
        .upload-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
            padding: 10px;
            background: rgba(26, 37, 48, 0.5);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .upload-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-item:hover {
            background: rgba(52, 152, 219, 0.2);
        }
        
        .upload-item:last-child {
            margin-bottom: 0;
        }
        
        .upload-name {
            font-weight: 500;
            margin-bottom: 4px;
            color: #3498db;
        }
        
        .upload-description {
            font-size: 13px;
            color: #bdc3c7;
            margin-bottom: 6px;
        }
        
        .upload-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #95a5a6;
        }
        
        /* 登录区域 */
        .auth-container {
            padding: 15px;
            background: rgba(39, 55, 70, 0.8);
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        
        .auth-buttons button {
            margin-top: 0;
            flex: 1;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 90%;
            }
            
            .auth-buttons {
                flex-direction: column;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(26, 37, 48, 0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(52, 152, 219, 0.5);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #3498db;
        }
        
        .tab-container {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tab {
            padding: 8px 15px;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s;
        }
        
        .tab.active {
            opacity: 1;
            border-bottom: 2px solid #3498db;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 6px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-name {
            font-weight: 500;
            color: #3498db;
        }
        
        .user-email {
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <!-- 游戏容器 -->
    <div class="game-container">
        <iframe src="https://kiomet.com" class="game-frame" id="kiometFrame"></iframe>
    </div>

    <!-- 侧边栏 -->
    <div class="sidebar left-sidebar" id="leftSidebar">
        <!-- 用户信息区域 -->
        <div id="userInfoContainer" style="display: none;">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <div class="user-name" id="userName">用户</div>
                    <div class="user-email" id="userEmail">user@example.com</div>
                </div>
                <button class="secondary" id="logoutBtn" style="width: auto; padding: 5px 10px;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
        
        <!-- 登录区域 -->
        <div id="authContainer" class="auth-container">
            <h3 class="widget-title"><i class="fas fa-user"></i> 用户登录</h3>
            <input type="email" id="emailInput" placeholder="邮箱地址" />
            <input type="password" id="passwordInput" placeholder="密码" />
            <div class="auth-buttons">
                <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> 登录</button>
                <button class="secondary" id="registerBtn"><i class="fas fa-user-plus"></i> 注册</button>
            </div>
            <div class="status info" id="authStatus">请输入邮箱和密码登录或注册</div>
        </div>
        
        <div class="tab-container">
            <div class="tab active" data-tab="upload">上传进度</div>
            <div class="tab" data-tab="download">下载进度</div>
            <div class="tab" data-tab="manage">管理数据</div>
        </div>
        
        <!-- 上传进度标签页 -->
        <div class="tab-content active" id="upload-tab">
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-upload"></i> 上传游戏进度</h3>
                <p style="margin-bottom: 15px; font-size: 14px;">将您的Kiomet游戏进度上传到云端，与其他玩家共享或备份。</p>
                
                <div class="data-item">
                    <span class="data-key">进度名称</span>
                    <input type="text" id="saveName" value="我的Kiomet进度" style="width: auto; margin: 0;" />
                </div>
                
                <div class="data-item">
                    <span class="data-key">数据大小</span>
                    <span class="data-value" id="dataSize">0 KB</span>
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="uploadProgress"></div>
                </div>
                
                <textarea id="saveDescription" placeholder="添加进度描述（可选）..."></textarea>
                
                <button id="uploadBtn"><i class="fas fa-cloud-upload-alt"></i> 上传进度</button>
                <div class="status info" id="uploadStatus">请先登录</div>
            </div>
        </div>
        
        <!-- 下载进度标签页 -->
        <div class="tab-content" id="download-tab">
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-download"></i> 下载游戏进度</h3>
                <p style="margin-bottom: 15px; font-size: 14px;">从云端下载其他玩家共享的Kiomet游戏进度。</p>
                
                <div class="upload-list" id="savesList">
                    <div class="status info">请先登录以查看存档</div>
                </div>
                
                <button id="refreshBtn" class="secondary"><i class="fas fa-sync"></i> 刷新列表</button>
                <button id="downloadBtn"><i class="fas fa-download"></i> 下载选中进度</button>
                <div class="status info" id="downloadStatus">请先登录</div>
            </div>
        </div>
        
        <!-- 管理数据标签页 -->
        <div class="tab-content" id="manage-tab">
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-database"></i> 本地数据管理</h3>
                <p style="margin-bottom: 15px; font-size: 14px;">管理您的Kiomet本地存储数据。</p>
                
                <div class="data-item">
                    <span class="data-key">本地存储使用</span>
                    <span class="data-value" id="localStorageUsage">0 KB / 5 MB</span>
                </div>
                
                <div class="data-item">
                    <span class="data-key">Kiomet数据项</span>
                    <span class="data-value" id="kiometItems">0 项</span>
                </div>
                
                <textarea id="localData" placeholder="本地数据将显示在这里..." readonly></textarea>
                
                <button id="exportBtn" class="secondary"><i class="fas fa-file-export"></i> 导出数据</button>
                <button id="importBtn"><i class="fas fa-file-import"></i> 导入数据</button>
                <div class="status info" id="manageStatus">就绪</div>
            </div>
        </div>
    </div>

    <!-- 浮动按钮 -->
    <div class="float-buttons">
        <button class="float-btn" id="floatToggle">
            <i class="fas fa-exchange-alt" id="toggleIcon"></i>
        </button>
    </div>

    <script>
        // Supabase初始化
        const supabaseUrl = 'https://meeuseqgrbegaalrayeu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1eZXVzZXFncmJlZ2FhbHJheWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYxMzI0MjUsImV4cCI6MjA3MTcwODQyNX0.DSLAtwP-vrFYyVeBH0l9_tyoQF2rHHW6jPcnsQ7dKEM';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // 全局变量
        let selectedSaveId = null;
        let currentUser = null;
        
        // DOM元素
        const leftSidebar = document.getElementById('leftSidebar');
        const floatToggle = document.getElementById('floatToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        const authContainer = document.getElementById('authContainer');
        const userInfoContainer = document.getElementById('userInfoContainer');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            updateLocalStorageInfo();
            
            // 设置事件监听器
            setupEventListeners();
        });
        
        // 检查认证状态
        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session?.user) {
                currentUser = session.user;
                updateUserInterface(true);
            } else {
                updateUserInterface(false);
            }
        }
        
        // 更新用户界面
        function updateUserInterface(isLoggedIn) {
            if (isLoggedIn && currentUser) {
                authContainer.style.display = 'none';
                userInfoContainer.style.display = 'block';
                
                // 更新用户信息
                const email = currentUser.email;
                userName.textContent = email.split('@')[0];
                userEmail.textContent = email;
                userAvatar.textContent = email[0].toUpperCase();
                
                // 更新状态信息
                document.getElementById('uploadStatus').textContent = '准备上传';
                document.getElementById('downloadStatus').textContent = '选择要下载的进度';
                
                // 加载存档列表
                loadCloudSaves();
            } else {
                authContainer.style.display = 'block';
                userInfoContainer.style.display = 'none';
                
                // 更新状态信息
                document.getElementById('uploadStatus').textContent = '请先登录';
                document.getElementById('downloadStatus').textContent = '请先登录';
                document.getElementById('savesList').innerHTML = '<div class="status info">请先登录以查看存档</div>';
            }
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 侧边栏切换
            floatToggle.addEventListener('click', toggleSidebar);
            
            // 游戏区域点击关闭侧边栏
            document.querySelector('.game-container').addEventListener('click', () => {
                leftSidebar.classList.remove('active');
                toggleIcon.className = 'fas fa-exchange-alt';
            });
            
            // 标签切换
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    
                    // 移除所有active类
                    tabs.forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                    
                    // 添加active类到当前标签和内容
                    tab.classList.add('active');
                    document.getElementById(`${tabId}-tab`).classList.add('active');
                    
                    // 确保侧边栏是展开状态
                    leftSidebar.classList.add('active');
                    toggleIcon.className = 'fas fa-times';
                    
                    // 更新相关信息
                    if (tabId === 'download' && currentUser) {
                        loadCloudSaves();
                    } else if (tabId === 'manage') {
                        updateLocalStorageInfo();
                    }
                });
            });
            
            // 认证按钮
            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('registerBtn').addEventListener('click', register);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            // 上传按钮
            document.getElementById('uploadBtn').addEventListener('click', uploadSave);
            
            // 下载按钮
            document.getElementById('downloadBtn').addEventListener('click', downloadSave);
            document.getElementById('refreshBtn').addEventListener('click', () => {
                if (currentUser) loadCloudSaves();
            });
            
            // 数据管理按钮
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', importData);
            
            // 快捷键支持
            document.addEventListener('keydown', (e) => {
                if (e.key === 't' || e.key === 'T') {
                    e.preventDefault();
                    toggleSidebar();
                } else if (e.key === 'Escape') {
                    leftSidebar.classList.remove('active');
                    toggleIcon.className = 'fas fa-exchange-alt';
                }
            });
        }
        
        // 侧边栏切换功能
        function toggleSidebar() {
            const isActive = leftSidebar.classList.contains('active');
            if (isActive) {
                leftSidebar.classList.remove('active');
                toggleIcon.className = 'fas fa-exchange-alt';
            } else {
                leftSidebar.classList.add('active');
                toggleIcon.className = 'fas fa-times';
                updateLocalStorageInfo();
            }
        }
        
        // 登录功能
        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const authStatus = document.getElementById('authStatus');
            
            if (!email || !password) {
                authStatus.className = 'status error';
                authStatus.textContent = '请输入邮箱和密码';
                return;
            }
            
            authStatus.className = 'status info';
            authStatus.textContent = '登录中...';
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });
            
            if (error) {
                authStatus.className = 'status error';
                authStatus.textContent = `登录失败: ${error.message}`;
            } else {
                currentUser = data.user;
                authStatus.className = 'status success';
                authStatus.textContent = '登录成功！';
                updateUserInterface(true);
            }
        }
        
        // 注册功能
        async function register() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const authStatus = document.getElementById('authStatus');
            
            if (!email || !password) {
                authStatus.className = 'status error';
                authStatus.textContent = '请输入邮箱和密码';
                return;
            }
            
            if (password.length < 6) {
                authStatus.className = 'status error';
                authStatus.textContent = '密码长度至少6位';
                return;
            }
            
            authStatus.className = 'status info';
            authStatus.textContent = '注册中...';
            
            const { data, error } = await supabase.auth.signUp({
                email,
                password
            });
            
            if (error) {
                authStatus.className = 'status error';
                authStatus.textContent = `注册失败: ${error.message}`;
            } else {
                authStatus.className = 'status success';
                authStatus.textContent = '注册成功！请检查邮箱验证';
            }
        }
        
        // 登出功能
        async function logout() {
            const { error } = await supabase.auth.signOut();
            if (!error) {
                currentUser = null;
                updateUserInterface(false);
                document.getElementById('authStatus').className = 'status info';
                document.getElementById('authStatus').textContent = '已登出';
            }
        }
        
        // 获取Kiomet相关的localStorage数据
        function getKiometData() {
            const kiometData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.toLowerCase().includes('kiomet')) {
                    kiometData[key] = localStorage.getItem(key);
                }
            }
            return kiometData;
        }
        
        // 更新本地存储信息
        function updateLocalStorageInfo() {
            const kiometData = getKiometData();
            const dataSize = JSON.stringify(kiometData).length;
            
            // 更新UI显示
            document.getElementById('localStorageUsage').textContent = 
                `${(dataSize / 1024).toFixed(1)} KB / 5 MB`;
            
            document.getElementById('kiometItems').textContent = 
                `${Object.keys(kiometData).length} 项`;
            
            document.getElementById('dataSize').textContent = 
                `${(dataSize / 1024).toFixed(1)} KB`;
            
            // 显示数据预览
            document.getElementById('localData').value = 
                JSON.stringify(kiometData, null, 2);
        }
        
        // 上传存档到Supabase
        async function uploadSave() {
            if (!currentUser) {
                document.getElementById('uploadStatus').className = 'status error';
                document.getElementById('uploadStatus').textContent = '请先登录';
                return;
            }
            
            const uploadStatus = document.getElementById('uploadStatus');
            const uploadProgress = document.getElementById('uploadProgress');
            const saveDescription = document.getElementById('saveDescription').value;
            const saveName = document.getElementById('saveName').value;
            
            if (!saveName) {
                uploadStatus.className = 'status error';
                uploadStatus.textContent = '请输入存档名称';
                return;
            }
            
            uploadStatus.className = 'status info';
            uploadStatus.textContent = '准备上传数据...';
            
            // 获取Kiomet数据
            const kiometData = getKiometData();
            const dataSize = JSON.stringify(kiometData).length;
            
            if (dataSize === 0) {
                uploadStatus.className = 'status warning';
                uploadStatus.textContent = '未找到Kiomet游戏数据';
                return;
            }
            
            // 模拟上传进度
            for (let i = 0; i <= 100; i += 20) {
                await new Promise(resolve => setTimeout(resolve, 200));
                uploadProgress.style.width = `${i}%`;
                
                if (i === 40) {
                    uploadStatus.textContent = '加密数据中...';
                } else if (i === 80) {
                    uploadStatus.textContent = '上传到云端...';
                }
            }
            
            try {
                // 上传到Supabase
                const { data, error } = await supabase
                    .from('kiomet_saves')
                    .insert([
                        {
                            name: saveName,
                            description: saveDescription,
                            data: kiometData,
                            user_id: currentUser.id,
                            user_email: currentUser.email,
                            data_size: dataSize
                        }
                    ])
                    .select();
                
                if (error) {
                    throw error;
                }
                
                uploadProgress.style.width = '100%';
                uploadStatus.className = 'status success';
                uploadStatus.textContent = `上传成功！存档ID: ${data[0].id}`;
                
                // 刷新列表
                if (document.getElementById('download-tab').classList.contains('active')) {
                    loadCloudSaves();
                }
                
                // 重置进度条
                setTimeout(() => {
                    uploadProgress.style.width = '0%';
                }, 2000);
                
            } catch (error) {
                uploadProgress.style.width = '0%';
                uploadStatus.className = 'status error';
                uploadStatus.textContent = `上传失败: ${error.message}`;
            }
        }
        
        // 从Supabase加载存档列表
        async function loadCloudSaves() {
            if (!currentUser) return;
            
            const savesList = document.getElementById('savesList');
            const downloadStatus = document.getElementById('downloadStatus');
            
            downloadStatus.className = 'status info';
            downloadStatus.textContent = '加载存档列表中...';
            
            try {
                const { data, error } = await supabase
                    .from('kiomet_saves')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    throw error;
                }
                
                // 清空列表
                savesList.innerHTML = '';
                
                if (data.length === 0) {
                    savesList.innerHTML = '<div class="status info">暂无存档</div>';
                    downloadStatus.textContent = '没有找到存档';
                    return;
                }
                
                // 添加存档到列表
                data.forEach(save => {
                    const item = document.createElement('div');
                    item.className = 'upload-item';
                    item.dataset.id = save.id;
                    
                    item.innerHTML = `
                        <div class="upload-name">${save.name}</div>
                        <div class="upload-description">${save.description || '暂无描述'}</div>
                        <div class="upload-meta">
                            <span>玩家: ${save.user_email?.split('@')[0] || '未知'}</span>
                            <span>${new Date(save.created_at).toLocaleDateString()}</span>
                            <span>${(save.data_size / 1024).toFixed(1)} KB</span>
                        </div>
                    `;
                    
                    // 添加点击选择功能
                    item.addEventListener('click', function() {
                        document.querySelectorAll('.upload-item').forEach(i => {
                            i.style.background = 'rgba(52, 152, 219, 0.1)';
                        });
                        this.style.background = 'rgba(52, 152, 219, 0.3)';
                        selectedSaveId = save.id;
                        downloadStatus.textContent = `已选择: ${save.name}`;
                    });
                    
                    savesList.appendChild(item);
                });
                
                downloadStatus.textContent = `已加载 ${data.length} 个存档`;
                
            } catch (error) {
                savesList.innerHTML = '<div class="status error">加载失败</div>';
                downloadStatus.className = 'status error';
                downloadStatus.textContent = `加载失败: ${error.message}`;
            }
        }
        
        // 从Supabase下载存档
        async function downloadSave() {
            if (!currentUser) {
                document.getElementById('downloadStatus').className = 'status error';
                document.getElementById('downloadStatus').textContent = '请先登录';
                return;
            }
            
            if (!selectedSaveId) {
                document.getElementById('downloadStatus').className = 'status error';
                document.getElementById('downloadStatus').textContent = '请先选择一个存档';
                return;
            }
            
            const downloadStatus = document.getElementById('downloadStatus');
            
            downloadStatus.className = 'status info';
            downloadStatus.textContent = '下载中...';
            
            try {
                const { data, error } = await supabase
                    .from('kiomet_saves')
                    .select('*')
                    .eq('id', selectedSaveId)
                    .single();
                
                if (error) {
                    throw error;
                }
                
                // 应用到本地存储
                applySaveData(data.data);
                
                downloadStatus.className = 'status success';
                downloadStatus.textContent = '下载完成！数据已应用到本地';
                
            } catch (error) {
                downloadStatus.className = 'status error';
                downloadStatus.textContent = `下载失败: ${error.message}`;
            }
        }
        
        // 应用到本地存储的函数
        function applySaveData(saveData) {
            // 清空现有的Kiomet相关数据
            Object.keys(localStorage).forEach(key => {
                if (key.toLowerCase().includes('kiomet')) {
                    localStorage.removeItem(key);
                }
            });
            
            // 应用新数据
            Object.keys(saveData).forEach(key => {
                localStorage.setItem(key, saveData[key]);
            });
            
            // 更新UI
            updateLocalStorageInfo();
            
            // 提示用户可能需要刷新游戏
            alert('进度数据已加载，可能需要刷新游戏页面使更改生效');
        }
        
        // 导出数据功能
        function exportData() {
            const kiometData = getKiometData();
            const dataStr = JSON.stringify(kiometData, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = 'kiomet_backup.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            
            document.getElementById('manageStatus').className = 'status success';
            document.getElementById('manageStatus').textContent = '数据已导出为JSON文件';
        }
        
        // 导入数据功能
        function importData() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json';
            
            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        
                        // 应用到本地存储
                        applySaveData(importedData);
                        
                        document.getElementById('manageStatus').className = 'status success';
                        document.getElementById('manageStatus').textContent = `已导入 ${Object.keys(importedData).length} 条数据`;
                        
                    } catch (error) {
                        document.getElementById('manageStatus').className = 'status error';
                        document.getElementById('manageStatus').textContent = '导入失败: 无效的JSON格式';
                    }
                };
                
                reader.readAsText(file);
            });
            
            fileInput.click();
        }
    </script>
</body>
</html>
