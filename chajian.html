<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiomet游戏辅助面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e17 0%, #1a2435 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: auto 1fr auto;
            gap: 15px;
            padding: 15px;
            min-height: 100vh;
        }
        
        header {
            grid-column: 1 / 4;
            background: linear-gradient(90deg, #1a1f2d 0%, #252b3d 100%);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a4155;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo h1 {
            font-size: 28px;
            background: linear-gradient(45deg, #6e8afa, #fa6eca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .logo-img {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6e8afa, #fa6eca);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(110, 138, 250, 0.5);
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }
        
        nav a {
            color: #b0b5c7;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        nav a:hover {
            color: #6e8afa;
            background: rgba(110, 138, 250, 0.1);
            transform: translateY(-2px);
        }
        
        .main-content {
            grid-column: 2;
            grid-row: 2;
            background: #1a1f2d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            border: 1px solid #3a4155;
        }
        
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        
        .game-tabs {
            display: flex;
            background: #252b3d;
            padding: 10px 15px 0;
            border-bottom: 1px solid #3a4155;
        }
        
        .game-tab {
            padding: 10px 20px;
            background: #2a3143;
            margin-right: 5px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .game-tab.active {
            background: #1a1f2d;
            color: #6e8afa;
        }
        
        .game-frame {
            width: 100%;
            height: 600px;
            background: #0f121b;
            border: none;
            flex: 1;
        }
        
        .game-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            gap: 20px;
            background: linear-gradient(135deg, #0f121b 0%, #1a1f2d 100%);
        }
        
        .game-placeholder i {
            font-size: 48px;
            color: #6e8afa;
        }
        
        .game-placeholder p {
            font-size: 18px;
            color: #b0b5c7;
            text-align: center;
        }
        
        .sidebar {
            background: linear-gradient(180deg, #1a1f2d 0%, #252b3d 100%);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a4155;
        }
        
        .left-sidebar {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .right-sidebar {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .widget {
            background: #252b3d;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a4155;
        }
        
        .widget-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #6e8afa;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3a4155;
        }
        
        .timer-display {
            font-size: 28px;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: #1c2130;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            color: #6e8afa;
            font-weight: bold;
            letter-spacing: 2px;
            border: 1px solid #3a4155;
        }
        
        .timer-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            background: linear-gradient(to right, #6e8afa, #8a6efa);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            flex: 1;
        }
        
        button:hover {
            background: linear-gradient(to right, #5a75e0, #7a5ae0);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        textarea {
            width: 100%;
            height: 150px;
            background: #1c2130;
            border: 1px solid #3a4155;
            border-radius: 8px;
            padding: 12px;
            color: #e0e0e0;
            resize: vertical;
            transition: all 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #6e8afa;
            box-shadow: 0 0 0 2px rgba(110, 138, 250, 0.2);
        }
        
        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #1c2130;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .shortcut-item:hover {
            background: #2a3143;
            transform: translateX(5px);
        }
        
        .key {
            background: #3a4155;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            color: #6e8afa;
        }
        
        footer {
            grid-column: 1 / 4;
            grid-row: 3;
            text-align: center;
            padding: 20px;
            background: #1a1f2d;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a4155;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stat-value {
            color: #6e8afa;
            font-weight: bold;
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto auto;
            }
            
            header, .main-content, .left-sidebar, .right-sidebar, footer {
                grid-column: 1;
            }
            
            .left-sidebar, .right-sidebar {
                grid-row: auto;
                margin-bottom: 15px;
            }
            
            .main-content {
                grid-row: 3;
            }
            
            footer {
                grid-row: 5;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1f2d;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3a4155;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #6e8afa;
        }
        
        /* 动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-img">K</div>
                <h1>KIOMET 游戏助手</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="#"><i class="fas fa-home"></i> 首页</a></li>
                    <li><a href="#"><i class="fas fa-gamepad"></i> 游戏</a></li>
                    <li><a href="#"><i class="fas fa-tools"></i> 工具</a></li>
                    <li><a href="#"><i class="fas fa-info-circle"></i> 关于</a></li>
                </ul>
            </nav>
        </header>

        <aside class="sidebar left-sidebar">
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-clock"></i> 计时器</h3>
                <div class="timer-display">
                    <span id="timer">00:00:00</span>
                </div>
                <div class="timer-controls">
                    <button id="startTimer"><i class="fas fa-play"></i> 开始</button>
                    <button id="pauseTimer"><i class="fas fa-pause"></i> 暂停</button>
                    <button id="resetTimer"><i class="fas fa-redo"></i> 重置</button>
                </div>
            </div>

            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-sticky-note"></i> 游戏笔记</h3>
                <textarea id="gameNotes" placeholder="记录你的游戏策略、技巧或重要信息..."></textarea>
                <button id="saveNotes" style="margin-top: 10px;"><i class="fas fa-save"></i> 保存笔记</button>
            </div>
            
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-bolt"></i> 快速操作</h3>
                <div class="timer-controls">
                    <button id="quickSave"><i class="fas fa-save"></i> 快速保存</button>
                    <button id="quickLoad"><i class="fas fa-file-import"></i> 快速加载</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="game-tabs">
                <div class="game-tab active">Kiomet游戏</div>
                <div class="game-tab">攻略</div>
                <div class="game-tab">排行榜</div>
            </div>
            <div class="game-container">
                <iframe src="https://kiomet.com" class="game-frame" id="kiometFrame"></iframe>
            </div>
        </main>

        <aside class="sidebar right-sidebar">
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-keyboard"></i> 快捷键</h3>
                <div class="shortcut-list">
                    <div class="shortcut-item">
                        <span>快速保存</span>
                        <span class="key">Ctrl + S</span>
                    </div>
                    <div class="shortcut-item">
                        <span>截图</span>
                        <span class="key">F12</span>
                    </div>
                    <div class="shortcut-item">
                        <span>显示/隐藏界面</span>
                        <span class="key">F1</span>
                    </div>
                    <div class="shortcut-item">
                        <span>快速退出</span>
                        <span class="key">Esc</span>
                    </div>
                </div>
            </div>

            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-calculator"></i> 资源计算</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="number" placeholder="资源数量" style="padding: 10px; background: #1c2130; border: 1px solid #3a4155; border-radius: 6px; color: white;">
                    <button><i class="fas fa-calculator"></i> 计算生产效率</button>
                </div>
            </div>

            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-users"></i> 团队聊天</h3>
                <div style="height: 120px; background: #1c2130; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #3a4155;">
                    <p>[团队] 玩家1: 有人要组队吗？</p>
                    <p>[团队] 玩家2: 10分钟后副本门口见</p>
                    <p>[团队] 玩家3: 需要更多资源吗？</p>
                </div>
                <div style="display: flex;">
                    <input type="text" placeholder="输入消息..." style="flex: 1; padding: 10px; background: #1c2130; border: 1px solid #3a4155; border-radius: 6px 0 0 6px; color: white;">
                    <button style="border-radius: 0 6px 6px 0;"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </aside>

        <footer>
            <p>Kiomet游戏助手 &copy; 2023 - 本工具仅供游戏辅助使用，与Kiomet无直接关联</p>
            <div class="stats">
                <div class="stat-item">
                    <i class="fas fa-users"></i>
                    <span>在线玩家: <span class="stat-value">1,245</span></span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-clock"></i>
                    <span>运行时间: <span class="stat-value" id="uptime">00:00:00</span></span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // 计时器功能
        let timerInterval;
        let timerRunning = false;
        let seconds = 0, minutes = 0, hours = 0;
        
        const timerDisplay = document.getElementById('timer');
        const startTimerBtn = document.getElementById('startTimer');
        const pauseTimerBtn = document.getElementById('pauseTimer');
        const resetTimerBtn = document.getElementById('resetTimer');
        
        function updateTimer() {
            seconds++;
            if (seconds >= 60) {
                seconds = 0;
                minutes++;
                if (minutes >= 60) {
                    minutes = 0;
                    hours++;
                }
            }
            
            timerDisplay.textContent = 
                (hours ? (hours > 9 ? hours : "0" + hours) : "00") + ":" + 
                (minutes ? (minutes > 9 ? minutes : "0" + minutes) : "00") + ":" + 
                (seconds > 9 ? seconds : "0" + seconds);
        }
        
        startTimerBtn.addEventListener('click', () => {
            if (!timerRunning) {
                timerInterval = setInterval(updateTimer, 1000);
                timerRunning = true;
                startTimerBtn.innerHTML = '<i class="fas fa-play"></i> 运行中';
                startTimerBtn.style.background = 'linear-gradient(to right, #2ecc71, #27ae60)';
            }
        });
        
        pauseTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            startTimerBtn.innerHTML = '<i class="fas fa-play"></i> 开始';
            startTimerBtn.style.background = 'linear-gradient(to right, #6e8afa, #8a6efa)';
        });
        
        resetTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            seconds = 0; minutes = 0; hours = 0;
            timerDisplay.textContent = "00:00:00";
            startTimerBtn.innerHTML = '<i class="fas fa-play"></i> 开始';
            startTimerBtn.style.background = 'linear-gradient(to right, #6e8afa, #8a6efa)';
        });
        
        // 笔记保存功能
        const gameNotes = document.getElementById('gameNotes');
        const saveNotesBtn = document.getElementById('saveNotes');
        
        // 加载保存的笔记
        const savedNotes = localStorage.getItem('kiometNotes');
        if (savedNotes) {
            gameNotes.value = savedNotes;
        }
        
        saveNotesBtn.addEventListener('click', () => {
            localStorage.setItem('kiometNotes', gameNotes.value);
            saveNotesBtn.innerHTML = '<i class="fas fa-check"></i> 已保存!';
            setTimeout(() => {
                saveNotesBtn.innerHTML = '<i class="fas fa-save"></i> 保存笔记';
            }, 2000);
        });
        
        // 运行时间计时器
        let uptimeSeconds = 0;
        const uptimeDisplay = document.getElementById('uptime');
        
        setInterval(() => {
            uptimeSeconds++;
            const hrs = Math.floor(uptimeSeconds / 3600);
            const mins = Math.floor((uptimeSeconds % 3600) / 60);
            const secs = uptimeSeconds % 60;
            
            uptimeDisplay.textContent = 
                (hrs > 9 ? hrs : "0" + hrs) + ":" + 
                (mins > 9 ? mins : "0" + mins) + ":" + 
                (secs > 9 ? secs : "0" + secs);
        }, 1000);
        
        // iframe加载状态检测
        const kiometFrame = document.getElementById('kiometFrame');
        
        kiometFrame.addEventListener('load', function() {
            console.log('Kiomet游戏加载完成');
            // 可以在这里添加游戏加载完成后的回调函数
        });
        
        kiometFrame.addEventListener('error', function() {
            console.log('Kiomet游戏加载失败');
            // 可以在这里添加游戏加载失败后的处理
        });
    </script>
</body>
</html>
