<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiomet游戏辅助面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e17 0%, #1a2435 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: auto 1fr auto;
            gap: 15px;
            padding: 15px;
            min-height: 100vh;
        }
        
        header {
            grid-column: 1 / 4;
            background: linear-gradient(90deg, #1a1f2d 0%, #252b3d 100%);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a4155;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo h1 {
            font-size: 28px;
            background: linear-gradient(45deg, #6e8afa, #fa6eca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .logo-img {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #6e8afa, #fa6eca);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(110, 138, 250, 0.5);
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }
        
        nav a {
            color: #b0b5c7;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 6px;
        }
        
        nav a:hover {
            color: #6e8afa;
            background: rgba(110, 138, 250, 0.1);
            transform: translateY(-2px);
        }
        
        .main-content {
            grid-column: 2;
            grid-row: 2;
            background: #1a1f2d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            border: 1px solid #3a4155;
        }
        
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        
        .game-tabs {
            display: flex;
            background: #252b3d;
            padding: 10px 15px 0;
            border-bottom: 1px solid #3a4155;
        }
        
        .game-tab {
            padding: 10px 20px;
            background: #2a3143;
            margin-right: 5px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .game-tab.active {
            background: #1a1f2d;
            color: #6e8afa;
        }
        
        .game-frame {
            width: 100%;
            height: 600px;
            background: #0f121b;
            border: none;
            flex: 1;
        }
        
        .sidebar {
            background: linear-gradient(180deg, #1a1f2d 0%, #252b3d 100%);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a4155;
        }
        
        .left-sidebar {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .right-sidebar {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .widget {
            background: #252b3d;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a4155;
        }
        
        .widget-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #6e8afa;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3a4155;
        }
        
        .timer-display {
            font-size: 28px;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: #1c2130;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            color: #6e8afa;
            font-weight: bold;
            letter-spacing: 2px;
            border: 1px solid #3a4155;
        }
        
        .timer-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            background: linear-gradient(to right, #6e8afa, #8a6efa);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            flex: 1;
        }
        
        button:hover {
            background: linear-gradient(to right, #5a75e0, #7a5ae0);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        textarea {
            width: 100%;
            height: 150px;
            background: #1c2130;
            border: 1px solid #3a4155;
            border-radius: 8px;
            padding: 12px;
            color: #e0e0e0;
            resize: vertical;
            transition: all 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #6e8afa;
            box-shadow: 0 0 0 2px rgba(110, 138, 250, 0.2);
        }
        
        .translation-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .language-selectors {
            display: flex;
            gap: 10px;
        }
        
        select {
            flex: 1;
            padding: 10px;
            background: #1c2130;
            border: 1px solid #3a4155;
            border-radius: 6px;
            color: #e0e0e0;
        }
        
        .translation-frame-container {
            height: 400px;
            border: 1px solid #3a4155;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .translation-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .translation-controls {
            display: flex;
            gap: 10px;
        }
        
        .api-status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
        
        .status-online {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        
        .status-offline {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        
        footer {
            grid-column: 1 / 4;
            grid-row: 3;
            text-align: center;
            padding: 20px;
            background: #1a1f2d;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #3a4155;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stat-value {
            color: #6e8afa;
            font-weight: bold;
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto auto;
            }
            
            header, .main-content, .left-sidebar, .right-sidebar, footer {
                grid-column: 1;
            }
            
            .left-sidebar, .right-sidebar {
                grid-row: auto;
                margin-bottom: 15px;
            }
            
            .main-content {
                grid-row: 3;
            }
            
            footer {
                grid-row: 5;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1f2d;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3a4155;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #6e8afa;
        }
        
        .translation-history {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #3a4155;
            border-radius: 8px;
            padding: 10px;
            background: #1c2130;
        }
        
        .history-item {
            padding: 8px;
            border-bottom: 1px solid #3a4155;
            font-size: 14px;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #6e8afa;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .translation-tips {
            background: rgba(110, 138, 250, 0.1);
            border-left: 4px solid #6e8afa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-img">K</div>
                <h1>KIOMET 游戏助手</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="#"><i class="fas fa-home"></i> 首页</a></li>
                    <li><a href="#"><i class="fas fa-gamepad"></i> 游戏</a></li>
                    <li><a href="#"><i class="fas fa-tools"></i> 工具</a></li>
                    <li><a href="#"><i class="fas fa-info-circle"></i> 关于</a></li>
                </ul>
            </nav>
        </header>

        <aside class="sidebar left-sidebar">
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-clock"></i> 计时器</h3>
                <div class="timer-display">
                    <span id="timer">00:00:00</span>
                </div>
                <div class="timer-controls">
                    <button id="startTimer"><i class="fas fa-play"></i> 开始</button>
                    <button id="pauseTimer"><i class="fas fa-pause"></i> 暂停</button>
                    <button id="resetTimer"><i class="fas fa-redo"></i> 重置</button>
                </div>
            </div>

            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-sticky-note"></i> 聊天内容编辑器</h3>
                <textarea id="gameNotes" placeholder="便于玩家编写聊天信息..."></textarea>
                <button id="saveNotes" style="margin-top: 10px;"><i class="fas fa-save"></i> 保存笔记</button>
            </div>
            
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-bolt"></i> 快速操作</h3>
                <div class="timer-controls">
                    <button id="quickSave"><i class="fas fa-save"></i> 快速保存</button>
                    <button id="quickLoad"><i class="fas fa-file-import"></i> 快速加载</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="game-tabs">
                <div class="game-tab active">Kiomet游戏</div>
                <div class="game-tab">攻略</div>
                <div class="game-tab">排行榜</div>
            </div>
            <div class="game-container">
                <iframe src="https://kiomet.com" class="game-frame" id="kiometFrame"></iframe>
            </div>
        </main>

        <aside class="sidebar right-sidebar">
            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-language"></i> 百度翻译</h3>
                <div class="translation-container">
                    <div class="language-selectors">
                        <select id="sourceLang">
                            <option value="auto">自动检测</option>
                            <option value="zh">中文</option>
                            <option value="en">英语</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                            <option value="fr">法语</option>
                            <option value="de">德语</option>
                            <option value="ru">俄语</option>
                            <option value="es">西班牙语</option>
                        </select>
                        <i class="fas fa-exchange-alt" style="align-self: center; color: #6e8afa;"></i>
                        <select id="targetLang">
                            <option value="en">英语</option>
                            <option value="zh">中文</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                            <option value="fr">法语</option>
                            <option value="de">德语</option>
                            <option value="ru">俄语</option>
                            <option value="es">西班牙语</option>
                        </select>
                    </div>
                    
                    <div class="translation-frame-container">
                        <iframe 
                            src="https://fanyi.baidu.com/m/trans" 
                            class="translation-frame" 
                            id="baiduTranslateFrame"
                            sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
                            loading="lazy">
                        </iframe>
                    </div>
                    
                    <div class="translation-tips">
                        <i class="fas fa-info-circle"></i> 提示：直接在百度翻译界面中输入文本进行翻译
                    </div>
                    
                    <div class="api-status status-online">
                        <i class="fas fa-check-circle"></i> 百度翻译已加载
                    </div>
                </div>
            </div>

            <div class="widget">
                <h3 class="widget-title"><i class="fas fa-keyboard"></i> 快捷键一览</h3>
                <div class="shortcut-list">
                    <div class="shortcut-item">
                        <span>定位国王</span>
                        <span class="key">H</span>
                    </div>
                    <div class="shortcut-item">
                        <span>显示兵线</span>
                        <span class="key">G</span>
                    </div>
                    <div class="shortcut-item">
                        <span>搜索同类单位</span>
                        <span class="key">T</span>
                    </div>
                    <div class="shortcut-item">
                        <span>等待更新……</span>
                        <span class="key">等待更新</span>
                    </div>
                </div>
            </div>
        </aside>

        <footer>
            <p>Kiomet游戏助手 &copy; 2023 - 本工具仅供游戏辅助使用，与Kiomet无直接关联</p>
            <div class="stats">
                <div class="stat-item">
                    <i class="fas fa-users"></i>
                    <span>在线玩家: <span class="stat-value">未知</span></span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-clock"></i>
                    <span>运行时间: <span class="stat-value" id="uptime">00:00:00</span></span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // 计时器功能
        let timerInterval;
        let timerRunning = false;
        let seconds = 0, minutes = 0, hours = 0;
        
        const timerDisplay = document.getElementById('timer');
        const startTimerBtn = document.getElementById('startTimer');
        const pauseTimerBtn = document.getElementById('pauseTimer');
        const resetTimerBtn = document.getElementById('resetTimer');
        
        function updateTimer() {
            seconds++;
            if (seconds >= 60) {
                seconds = 0;
                minutes++;
                if (minutes >= 60) {
                    minutes = 0;
                    hours++;
                }
            }
            
            timerDisplay.textContent = 
                (hours ? (hours > 9 ? hours : "0" + hours) : "00") + ":" + 
                (minutes ? (minutes > 9 ? minutes : "0" + minutes) : "00") + ":" + 
                (seconds > 9 ? seconds : "0" + seconds);
        }
        
        startTimerBtn.addEventListener('click', () => {
            if (!timerRunning) {
                timerInterval = setInterval(updateTimer, 1000);
                timerRunning = true;
                startTimerBtn.innerHTML = '<i class="fas fa-play"></i> 运行中';
                startTimerBtn.style.background = 'linear-gradient(to right, #2ecc71, #27ae60)';
            }
        });
        
        pauseTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            startTimerBtn.innerHTML = '<i class="fas fa-play"></i> 开始';
            startTimerBtn.style.background = 'linear-gradient(to right, #6e8afa, #8a6efa)';
        });
        
        resetTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            seconds = 0; minutes = 0; hours = 0;
            timerDisplay.textContent = "00:00:00";
            startTimerBtn.innerHTML = '<i class="fas fa-play"></i> 开始';
            startTimerBtn.style.background = 'linear-gradient(to right, #6e8afa, #8a6efa)';
        });
        
        // 笔记保存功能
        const gameNotes = document.getElementById('gameNotes');
        const saveNotesBtn = document.getElementById('saveNotes');
        
        // 加载保存的笔记
        const savedNotes = localStorage.getItem('kiometNotes');
        if (savedNotes) {
            gameNotes.value = savedNotes;
        }
        
        saveNotesBtn.addEventListener('click', () => {
            localStorage.setItem('kiometNotes', gameNotes.value);
            saveNotesBtn.innerHTML = '<i class="fas fa-check"></i> 已保存!';
            setTimeout(() => {
                saveNotesBtn.innerHTML = '<i class="fas fa-save"></i> 保存笔记';
            }, 2000);
        });
        
        // 运行时间计时器
        let uptimeSeconds = 0;
        const uptimeDisplay = document.getElementById('uptime');
        
        setInterval(() => {
            uptimeSeconds++;
            const hrs = Math.floor(uptimeSeconds / 3600);
            const mins = Math.floor((uptimeSeconds % 3600) / 60);
            const secs = uptimeSeconds % 60;
            
            uptimeDisplay.textContent = 
                (hrs > 9 ? hrs : "0" + hrs) + ":" + 
                (mins > 9 ? mins : "0" + mins) + ":" + 
                (secs > 9 ? secs : "0" + secs);
        }, 1000);
        
        // iframe加载状态检测
        const kiometFrame = document.getElementById('kiometFrame');
        const baiduTranslateFrame = document.getElementById('baiduTranslateFrame');
        
        kiometFrame.addEventListener('load', function() {
            console.log('Kiomet游戏加载完成');
        });
        
        kiometFrame.addEventListener('error', function() {
            console.log('Kiomet游戏加载失败');
        });
        
        baiduTranslateFrame.addEventListener('load', function() {
            console.log('百度翻译加载完成');
            document.querySelector('.api-status').innerHTML = '<i class="fas fa-check-circle"></i> 百度翻译已就绪';
        });
        
        // 语言选择变化时重新加载翻译页面
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        
        function updateTranslationPage() {
            const source = sourceLang.value;
            const target = targetLang.value;
            
            // 百度翻译URL参数
            let url = 'https://fanyi.baidu.com/m/trans';
            if (source !== 'auto' && target !== 'auto') {
                url += `#${source}/${target}/`;
            }
            
            baiduTranslateFrame.src = url;
            document.querySelector('.api-status').innerHTML = '<span class="loading"></span> 切换语言中...';
        }
        
        sourceLang.addEventListener('change', updateTranslationPage);
        targetLang.addEventListener('change', updateTranslationPage);
        
        // 添加快捷键支持
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 't') {
                e.preventDefault();
                // 尝试聚焦到翻译iframe中的输入框
                try {
                    const translateFrame = document.getElementById('baiduTranslateFrame');
                    const input = translateFrame.contentWindow.document.querySelector('textarea');
                    if (input) {
                        input.focus();
                    }
                } catch (error) {
                    console.log('无法直接访问翻译iframe内容');
                }
            }
        });
        
        // 初始化百度翻译
        updateTranslationPage();
    </script>
</body>
</html>
