<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KioMate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #0a0e17;
            color: #ecf0f1;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* 游戏容器 */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e17;
            z-index: 1;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 380px;
            background: rgba(26, 37, 48, 0.97);
            z-index: 900;
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.4);
        }
        
        .left-sidebar {
            left: 0;
            transform: translateX(-100%);
        }
        
        .left-sidebar.active {
            transform: translateX(0);
        }
        
        /* 浮动按钮 */
        .float-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 800;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            font-size: 20px;
        }
        
        .float-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        
        /* 小部件样式 */
        .widget {
            background: rgba(39, 55, 70, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .widget-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #3498db;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .timer-display {
            font-size: 24px;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: rgba(26, 37, 48, 0.5);
            padding: 12px;
            border-radius: 6px;
            margin: 8px 0;
            color: #2ecc71;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .timer-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        button {
            background: linear-gradient(to right, #3498db, #2ecc71);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            flex: 1;
            font-size: 14px;
        }
        
        button:hover {
            background: linear-gradient(to right, #2980b9, #27ae60);
        }
        
        textarea {
            width: 100%;
            height: 80px;
            background: rgba(26, 37, 48, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
            color: #e0e0e0;
            resize: vertical;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .translation-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: calc(100vh - 120px);
        }
        
        .language-selectors {
            display: flex;
            gap: 8px;
        }
        
        select {
            flex: 1;
            padding: 8px;
            background: rgba(26, 37, 48, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        .translation-frame-container {
            height: calc(100% - 60px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .translation-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .api-status {
            margin-top: 8px;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
        }
        
        .status-online {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        
        .shortcut-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        
        .shortcut-item:last-child {
            border-bottom: none;
        }
        
        .key {
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #3498db;
            font-size: 13px;
        }
        
        /* 积分系统样式 */
        .points-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .points-display {
            font-size: 20px;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: rgba(26, 37, 48, 0.5);
            padding: 12px;
            border-radius: 6px;
            color: #f39c12;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .points-controls {
            display: flex;
            gap: 8px;
        }
        
        .points-history {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
            background: rgba(26, 37, 48, 0.5);
        }
        
        .points-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }
        
        .points-item:last-child {
            border-bottom: none;
        }
        
        .points-positive {
            color: #2ecc71;
        }
        
        .points-negative {
            color: #e74c3c;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 90%;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(26, 37, 48, 0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(52, 152, 219, 0.5);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #3498db;
        }
        
        .minimized-handle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 80px;
            background: rgba(52, 152, 219, 0.8);
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.3);
            z-index: 850;
            display: none;
        }
        
        .minimized-handle.visible {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- 最小化时的把手 -->
    <div class="minimized-handle" id="minimizedHandle">
        <i class="fas fa-bars"></i>
    </div>

    <!-- 游戏容器 -->
    <div class="game-container">
        <iframe src="https://kiomet.com" class="game-frame" id="kiometFrame"></iframe>
    </div>

    <!-- 左侧工具栏 -->
    <div class="sidebar left-sidebar" id="leftSidebar">
        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-clock"></i> kiomet计时器</h3>
            <div class="timer-display">
                <span id="timer">00:00:00</span>
            </div>
            <div class="timer-controls">
                <button id="startTimer"><i class="fas fa-play"></i> 开始</button>
                <button id="pauseTimer"><i class="fas fa-pause"></i> 暂停</button>
                <button id="resetTimer"><i class="fas fa-redo"></i> 重置</button>
            </div>
        </div>

        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-sticky-note"></i> kiomet聊天编辑器</h3>
            <textarea id="gameNotes" placeholder="解决kiomet聊天框难以操作问题"></textarea>
            <button id="saveNotes" style="margin-top: 10px;"><i class="fas fa-save"></i> 保存内容</button>
        </div>
        
        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-language"></i> 百度翻译</h3>
            <div class="translation-container">
                <div class="language-selectors">
                    <select id="sourceLang">
                        <option value="auto">自动检测</option>
                        <option value="zh">中文</option>
                        <option value="en">英语</option>
                    </select>
                    <select id="targetLang">
                        <option value="en">英语</option>
                        <option value="zh">中文</option>
                    </select>
                </div>
                
                <div class="translation-frame-container">
                    <iframe 
                        src="https://fanyi.baidu.com/m/trans" 
                        class="translation-frame" 
                        id="baiduTranslateFrame"
                        sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
                        loading="lazy">
                    </iframe>
                </div>
                
                <div class="api-status status-online">
                    <i class="fas fa-check-circle"></i> 百度翻译已加载
                </div>
            </div>
        </div>
        
        <!-- 积分系统 -->
        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-coins"></i> 游戏积分系统</h3>
            <div class="points-container">
                <div class="points-display">
                    当前积分: <span id="pointsValue">0</span>
                </div>
                <div class="points-controls">
                    <button id="addPoints"><i class="fas fa-plus"></i> 增加积分</button>
                    <button id="viewLeaderboard"><i class="fas fa-trophy"></i> 排行榜</button>
                </div>
                <div class="points-history" id="pointsHistory">
                    <div class="points-item">积分记录加载中...</div>
                </div>
            </div>
        </div>
        
        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-keyboard"></i> 游戏快捷键</h3>
            <div class="shortcut-list">
                <div class="shortcut-item">
                    <span>定位国王</span>
                    <span class="key">H</span>
                </div>
                <div class="shortcut-item">
                    <span>显示兵线</span>
                    <span class="key">G</span>
                </div>
                <div class="shortcut-item">
                    <span>搜索同类单位</span>
                    <span class="key">T</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 浮动按钮 -->
    <div class="float-buttons">
        <button class="float-btn" id="floatToggle">
            <i class="fas fa-bars" id="toggleIcon"></i>
        </button>
    </div>

    <script>
        // Supabase初始化
        const supabaseUrl = 'https://meeuseqgrbegaalrayeu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lZXVzZXFncmJlZ2FhbHJheWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYxMzI0MjUsImV4cCI6MjA3MTcwODQyNX0.DSLAtwP-vrFYyVeBH0l9_tyoQF2rHHW6jPcnsQ7dKEM';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // 用户ID（在实际应用中应该从登录系统获取）
        let userId = localStorage.getItem('kiomet_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('kiomet_user_id', userId);
        }
        
        // 侧边栏切换功能
        const leftSidebar = document.getElementById('leftSidebar');
        const minimizedHandle = document.getElementById('minimizedHandle');
        const floatToggle = document.getElementById('floatToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        
        function toggleSidebar() {
            const isActive = leftSidebar.classList.contains('active');
            if (isActive) {
                leftSidebar.classList.remove('active');
                minimizedHandle.classList.add('visible');
                toggleIcon.className = 'fas fa-bars';
            } else {
                leftSidebar.classList.add('active');
                minimizedHandle.classList.remove('visible');
                toggleIcon.className = 'fas fa-times';
            }
        }
        
        floatToggle.addEventListener('click', toggleSidebar);
        minimizedHandle.addEventListener('click', toggleSidebar);
        
        // 点击游戏区域关闭侧边栏
        document.querySelector('.game-container').addEventListener('click', () => {
            leftSidebar.classList.remove('active');
            minimizedHandle.classList.add('visible');
            toggleIcon.className = 'fas fa-bars';
        });
        
        // 计时器功能
        let timerInterval;
        let timerRunning = false;
        let seconds = 0, minutes = 0, hours = 0;
        
        const timerDisplay = document.getElementById('timer');
        const startTimerBtn = document.getElementById('startTimer');
        const pauseTimerBtn = document.getElementById('pauseTimer');
        const resetTimerBtn = document.getElementById('resetTimer');
        
        function updateTimer() {
            seconds++;
            if (seconds >= 60) {
                seconds = 0;
                minutes++;
                if (minutes >= 60) {
                    minutes = 0;
                    hours++;
                }
            }
            
            timerDisplay.textContent = 
                (hours ? (hours > 9 ? hours : "0" + hours) : "00") + ":" + 
                (minutes ? (minutes > 9 ? minutes : "0" + minutes) : "00") + ":" + 
                (seconds > 9 ? seconds : "0" + seconds);
        }
        
        startTimerBtn.addEventListener('click', () => {
            if (!timerRunning) {
                timerInterval = setInterval(updateTimer, 1000);
                timerRunning = true;
            }
        });
        
        pauseTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
        });
        
        resetTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            seconds = 0; minutes = 0; hours = 0;
            timerDisplay.textContent = "00:00:00";
        });
        
        // 笔记保存功能
        const gameNotes = document.getElementById('gameNotes');
        const saveNotesBtn = document.getElementById('saveNotes');
        
        // 加载保存的笔记
        const savedNotes = localStorage.getItem('kiometNotes');
        if (savedNotes) {
            gameNotes.value = savedNotes;
        }
        
        saveNotesBtn.addEventListener('click', () => {
            localStorage.setItem('kiometNotes', gameNotes.value);
            saveNotesBtn.innerHTML = '<i class="fas fa-check"></i> 已保存!';
            setTimeout(() => {
                saveNotesBtn.innerHTML = '<i class="fas fa-save"></i> 保存内容';
            }, 2000);
        });
        
        // 积分系统功能
        const pointsValue = document.getElementById('pointsValue');
        const pointsHistory = document.getElementById('pointsHistory');
        const addPointsBtn = document.getElementById('addPoints');
        const viewLeaderboardBtn = document.getElementById('viewLeaderboard');
        
        // 获取用户积分
        async function getUserPoints() {
            try {
                const { data, error } = await supabase
                    .from('user_points')
                    .select('points')
                    .eq('user_id', userId)
                    .single();
                
                if (error && error.code !== 'PGRST116') {
                    console.error('获取积分错误:', error);
                    return 0;
                }
                
                return data ? data.points : 0;
            } catch (error) {
                console.error('获取积分异常:', error);
                return 0;
            }
        }
        
        // 更新积分
        async function updatePoints(amount, reason) {
            try {
                // 获取当前积分
                const currentPoints = await getUserPoints();
                const newPoints = currentPoints + amount;
                
                // 更新积分
                const { data, error } = await supabase
                    .from('user_points')
                    .upsert({
                        user_id: userId,
                        points: newPoints,
                        updated_at: new Date().toISOString()
                    });
                
                if (error) {
                    console.error('更新积分错误:', error);
                    return false;
                }
                
                // 添加积分记录
                await addPointsHistory(amount, reason);
                
                // 更新显示
                pointsValue.textContent = newPoints;
                
                // 重新加载积分历史
                loadPointsHistory();
                
                return true;
            } catch (error) {
                console.error('更新积分异常:', error);
                return false;
            }
        }
        
        // 添加积分历史记录
        async function addPointsHistory(amount, reason) {
            try {
                const { error } = await supabase
                    .from('points_history')
                    .insert({
                        user_id: userId,
                        amount: amount,
                        reason: reason,
                        created_at: new Date().toISOString()
                    });
                
                if (error) {
                    console.error('添加积分记录错误:', error);
                }
            } catch (error) {
                console.error('添加积分记录异常:', error);
            }
        }
        
        // 加载积分历史
        async function loadPointsHistory() {
            try {
                const { data, error } = await supabase
                    .from('points_history')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false })
                    .limit(10);
                
                if (error) {
                    console.error('加载积分历史错误:', error);
                    pointsHistory.innerHTML = '<div class="points-item">加载积分历史失败</div>';
                    return;
                }
                
                if (data && data.length > 0) {
                    pointsHistory.innerHTML = '';
                    data.forEach(item => {
                        const pointsItem = document.createElement('div');
                        pointsItem.className = `points-item ${item.amount >= 0 ? 'points-positive' : 'points-negative'}`;
                        
                        const date = new Date(item.created_at).toLocaleDateString();
                        const sign = item.amount >= 0 ? '+' : '';
                        
                        pointsItem.textContent = `${date}: ${sign}${item.amount} - ${item.reason}`;
                        pointsHistory.appendChild(pointsItem);
                    });
                } else {
                    pointsHistory.innerHTML = '<div class="points-item">暂无积分记录</div>';
                }
            } catch (error) {
                console.error('加载积分历史异常:', error);
                pointsHistory.innerHTML = '<div class="points-item">加载积分历史失败</div>';
            }
        }
        
        // 初始化积分系统
        async function initPointsSystem() {
            const points = await getUserPoints();
            pointsValue.textContent = points;
            await loadPointsHistory();
        }
        
        // 增加积分按钮事件
        addPointsBtn.addEventListener('click', async () => {
            const amount = Math.floor(Math.random() * 10) + 1; // 随机1-10分
            const reason = '游戏奖励';
            
            const success = await updatePoints(amount, reason);
            if (success) {
                addPointsBtn.innerHTML = '<i class="fas fa-check"></i> 积分已增加';
                setTimeout(() => {
                    addPointsBtn.innerHTML = '<i class="fas fa-plus"></i> 增加积分';
                }, 2000);
            }
        });
        
        // 查看排行榜
        viewLeaderboardBtn.addEventListener('click', async () => {
            try {
                const { data, error } = await supabase
                    .from('user_points')
                    .select('*')
                    .order('points', { ascending: false })
                    .limit(10);
                
                if (error) {
                    console.error('获取排行榜错误:', error);
                    alert('获取排行榜失败');
                    return;
                }
                
                let leaderboardText = '积分排行榜:\n\n';
                data.forEach((item, index) => {
                    leaderboardText += `${index + 1}. 用户 ${item.user_id.substr(0, 8)}: ${item.points}分\n`;
                });
                
                alert(leaderboardText);
            } catch (error) {
                console.error('获取排行榜异常:', error);
                alert('获取排行榜失败');
            }
        });
        
        // 初始化
        initPointsSystem();
        
        // 快捷键支持
        document.addEventListener('keydown', (e) => {
            // T键 显示/隐藏侧边栏
            if (e.key === 't' || e.key === 'T') {
                e.preventDefault();
                toggleSidebar();
            }
            
            // ESC键关闭侧边栏
            if (e.key === 'Escape') {
                leftSidebar.classList.remove('active');
                minimizedHandle.classList.add('visible');
                toggleIcon.className = 'fas fa-bars';
            }
        });
    </script>
</body>
</html>
