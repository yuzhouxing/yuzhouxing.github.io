<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>武仙传说 · 攻略总集</title>
<meta name="description" content="武仙传说攻略索引：副本禁地、门派武学、装备炼制、丹方符箓、插件脚本，全量收录，一搜即达。">
<meta name="theme-color" content="#06070a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306070a'/%3E%3Cpath d='M16 4.5 26 9.4v8.3c0 5.7-4.1 9.8-10 11.1C10.1 27.5 6 23.4 6 17.7V9.4z' fill='none' stroke='%23d9a94f' stroke-width='1.5'/%3E%3Cpath d='M11.6 15.9l3.1 3.2 5.9-6.4' fill='none' stroke='%23d9a94f' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta property="og:title" content="武仙传说 · 攻略总集">
<meta property="og:description" content="副本禁地、门派武学、装备炼制、丹方符箓、插件脚本，全量收录，一搜即达。">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-noise"></div>
</div>
<div class="scanline" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <a class="brand" href="#/" data-nav>
    <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
      <path d="M16 3.5 26 8.4v8.3c0 5.7-4.1 9.8-10 11.1C10.1 27.5 6 23.4 6 17.7V8.4z" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M11.6 15.9l3.1 3.2 5.9-6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-txt">
      <span class="brand-cn">武仙</span>
      <span class="brand-code">INDEX</span>
    </span>
  </a>
  <nav class="topnav" id="topnav"></nav>
  <div class="topbar-right">
    <a class="chat-btn" href="https://fluxer.gg/OMHG588I" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.6c0 4.2-3.8 7.6-8.5 7.6-1 0-2-.15-2.9-.43L4.2 20.2l1.36-3.5C4.3 15.3 3.5 13.5 3.5 11.6 3.5 7.4 7.3 4 12 4s8.5 3.4 8.5 7.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8.6" cy="11.6" r="1" fill="currentColor"/><circle cx="12" cy="11.6" r="1" fill="currentColor"/><circle cx="15.4" cy="11.6" r="1" fill="currentColor"/></svg>
      <span class="chat-txt">加入聊天室</span>
    </a>
    <button class="cmd-btn" id="cmdBtn" aria-label="打开搜索面板">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4.4 4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="cmd-label">检索</span>
      <kbd id="kbdHint">⌘K</kbd>
    </button>
  </div>
</header>

<main>
  <!-- ============ 首页 ============ -->
  <section class="view view-home" id="viewHome">
    <div class="hero">
      <div class="hero-frame" aria-hidden="true">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
      </div>

      <div class="hero-inner">
        <div class="hero-meta">
          <span class="hm-item"><i class="dot"></i>INDEX ONLINE</span>
          <span class="hm-sep">/</span>
          <span class="hm-item" id="hmCount">—</span>
          <span class="hm-sep">/</span>
          <span class="hm-item">REV 2026.11</span>
        </div>

        <h1>
          <span class="h1-main">武仙传说</span>
          <span class="h1-line" aria-hidden="true"><i></i></span>
          <span class="h1-sub">攻略总集</span>
        </h1>

        <p class="lede">副本流程 · 门派路线 · 装备词条 · 丹方符箓 · 一搜即达。</p>

        <div class="searchbar" id="searchBar">
          <span class="sb-prompt">⟩</span>
          <input id="search" type="search" placeholder="检索副本、门派、材料…" autocomplete="off" spellcheck="false" aria-label="搜索攻略">
          <span class="sb-key">/</span>
        </div>

        <div class="hud" id="stats"></div>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="chips" id="chips" role="tablist"></div>
      <div class="toolbar-right">
        <span class="result-count" id="resultCount"></span>
        <button class="sort-btn" id="sortBtn" aria-label="切换排序">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="sortLabel">推荐</span>
        </button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <span class="empty-code">NO MATCH</span>
      <p>没有匹配的条目</p>
      <button class="ghost-btn" id="emptyReset">清空条件</button>
    </div>

    <footer class="foot">
      <div class="foot-rule"></div>
      <div class="foot-row">
        <span>共收录 <b id="footCount">—</b> 篇</span>
        <span class="foot-sep">/</span>
        <span>版权归原作者</span>
        <span class="foot-sep">/</span>
        <span>最后整理 <b id="footDate">—</b></span>
      </div>
      <p class="foot-hint"><kbd>/</kbd> 搜索 <kbd>⌘K</kbd> 面板 <kbd>←</kbd> 返回 <kbd>J</kbd><kbd>K</kbd> 翻篇</p>
      <p class="foot-by">by 舟行</p>
    </footer>
  </section>

  <!-- ============ 详情 ============ -->
  <section class="view view-reader" id="viewReader" hidden>
    <div class="reader-head">
      <div class="crumb" id="crumb"></div>
      <div class="reader-actions">
        <a class="dl-btn" id="dlBtn" download>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          原档
        </a>
        <button class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          返回
        </button>
      </div>
    </div>

    <div class="reader-layout">
      <aside class="toc" id="toc"></aside>
      <article class="article" id="article"></article>
    </div>

    <div class="pager" id="pager"></div>
  </section>
</main>

<!-- 命令面板 -->
<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk-backdrop" data-close></div>
  <div class="cmdk-panel" role="dialog" aria-label="搜索">
    <div class="cmdk-input">
      <span class="ci-prompt">⟩</span>
      <input id="cmdkInput" type="text" placeholder="搜索标题、分类、正文…" autocomplete="off" spellcheck="false">
      <span class="ci-esc">ESC</span>
    </div>
    <div class="cmdk-list" id="cmdkList"></div>
    <div class="cmdk-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 移动</span>
      <span><kbd>↵</kbd> 打开</span>
      <span><kbd>esc</kbd> 关闭</span>
      <span class="cmdk-count" id="cmdkCount"></span>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" aria-label="关闭">✕</button>
  <img id="lbImg" alt="">
  <div class="lb-hint">点击任意处关闭</div>
</div>

<script src="data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
