<body>
    <header class="site-header">

            <a class="brand" href="./index.html">

            <nav aria-label="主导航">

    <main>
        <section class="container hero" aria-labelledby="hero-title">
            <div>
                <div class="eyebrow">Dungeon Guides</div>
                <h1 id="hero-title">武仙传说 · <span>副本攻略</span></h1>
                <p class="hero-copy">点击卡片查看详细流程、掉落和参考数据。</p>
                <div class="hero-meta">
                    <span>无需登录</span>

        </section>

        <section class="section" id="guides-section" aria-labelledby="guides-title">
            <div class="container">
                <div class="section-heading">
                    <div>
                        <p class="section-kicker">Guides</p>
                        <h2 id="guides-title">副本攻略大全</h2>
                    </div>
                    <p>从树林到战神殿，全流程覆盖。</p>
                </div>
                <div class="cards-grid" id="guidesGrid"></div>

        </section>
    </main>

    <!-- 模态框、Toast、页脚与 index.html 相同，此处省略，实际使用需复制 -->
    <!-- 为了独立，下面仅包含必要的 JS 和数据，CSS 和 HTML 结构需完整 -->
    <!-- 因为篇幅，此处只给出核心 JS 和数据，实际部署请将 index.html 的通用部分（模态框、Toast、页脚）复制过来 -->

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">详情</h2>
                <button class="modal-close" id="modalClose" aria-label="关闭详情">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"><span class="check">✦</span><span id="toastMsg">已复制</span></div>

    <footer class="site-footer" id="notice">
        <div class="container footer-inner">
            <div class="footer-brand">武仙脚本库 · 副本攻略</div>
            <p class="notice">本站内容由舟行整理分享，仅供学习交流。</p>
        </div>
    </footer>

    <script>
        // ================================================================
        //  ★★★ 副本攻略数据 ★★★
        // ================================================================
        const dungeonData = [
            { id:1, name:'树林', drops:'动物皮毛、布衣、钢刀、铁戒指、铁棍、铁剑、英雄巾、布鞋、短衣劲装、基本轻功秘籍。', stats:'所有基础技能5级过关', recommend:'无', guide:'一开始的一金直接给南大街扬州武馆，在那学技能全基础5级，钱可以先付，以后总会用得上的。还有，刷到基本轻功，别浪费时间去读，等到要冲击武士了再去读，刷出来了可以先放在仓库里。' },
            { id:2, name:'财主府', drops:'家丁服、家丁鞋、东厢钥匙、崔莺莺的手镯、崔员外的戒指、小箱子、基本拳脚秘籍、基本招架秘籍、基本轻功秘籍', stats:'命中50、招架90-120', recommend:'崔莺莺的手镯（攻速悟性装，用到关服）', guide:'普通困难都一样，首先一路杀上去，杀管家有很大几率出"东厢钥匙"。杀完财主后，房间描述中开门（须持有钥匙！如无钥匙，此次无法100%完成。）开门后，救出丫鬟，带她到门口，她会请求住进你家，当然是选择同意啦。救完丫鬟，回去西厢询问崔莺莺，问完杀之，一定几率出镯子，然后再去东厢搜索获得小箱子（小箱子可以开出基本内功秘籍、基本招架秘籍、基本剑法秘籍、基本轻功秘籍、基本拳法秘籍，并且有1-9两金子），可以完成副本了。' },
            // ... 其余副本数据请从原完整 HTML 中复制（36个副本） ...
            // 由于篇幅，此处仅示例，实际部署请将原 dungeonData 完整数组复制过来
        ];

        // ---- DOM 引用 ----
        const gridGuides = document.getElementById('guidesGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const modalTitle = document.getElementById('modalTitle');
        const modalClose = document.getElementById('modalClose');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // ---- 渲染攻略卡片 ----
        function renderGuides() {
            if (!dungeonData.length) {
                gridGuides.innerHTML = `<div class="empty-state"><div class="big-icon">📜</div><h3>暂无攻略</h3></div>`;
                return;
            }
            let html = '';
            dungeonData.forEach(d => {
                html += `
                <div class="card-item" data-id="${d.id}" data-type="guide">
                  <span class="card-icon">⚔</span>
                  <h3>${escapeHtml(d.name)}</h3>
                  <div class="card-tags">
                    <span class="tag">${escapeHtml(d.stats || '无参考数据')}</span>
                  </div>
                  <p class="card-desc">${escapeHtml((d.drops || '').slice(0, 80))}${d.drops && d.drops.length > 80 ? '…' : ''}</p>
                  <span class="card-link">查看攻略 →</span>
                </div>`;
            });
            gridGuides.innerHTML = html;
            gridGuides.querySelectorAll('.card-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.id, 10);
                    const guide = dungeonData.find(d => d.id === id);
                    if (guide) openGuideModal(guide);
                });
            });
        }

        // ---- 打开攻略详情 ----
        function openGuideModal(guide) {
            modalTitle.textContent = guide.name + ' 攻略';
            let html = '';
            if (guide.drops) html += `<div class="guide-section"><strong>掉落</strong><div class="content">${escapeHtml(guide.drops)}</div></div>`;
            if (guide.stats) html += `<div class="guide-section"><strong>参考数据</strong><div class="content">${escapeHtml(guide.stats)}</div></div>`;
            if (guide.recommend) html += `<div class="guide-section"><strong>推荐刷取</strong><div class="content">${escapeHtml(guide.recommend)}</div></div>`;
            html += `<div class="guide-section"><strong>流程攻略</strong><div class="content" style="white-space:pre-wrap;">${escapeHtml(guide.guide)}</div></div>`;
            modalBody.innerHTML = html;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ---- 关闭、复制、Toast、转义函数与 index.html 相同，此处复用 ----
        function closeModal() { modalOverlay.classList.remove('active'); document.body.style.overflow = ''; }
        function copyToClipboard(text) { /* ... 同 index.html ... */ }
        function fallbackCopy(text) { /* ... 同 index.html ... */ }
        let toastTimer = null;
        function showToast(msg) { /* ... 同 index.html ... */ }
        function escapeHtml(str) { if (!str) return ''; const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }

        modalOverlay.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
        modalClose.addEventListener('click', closeModal);

        renderGuides();
        console.log('🐉 副本攻略已加载');
    </script>
</body>
</html>
