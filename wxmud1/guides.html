<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="武仙传说副本攻略大全。">

    <title>武仙脚本库 · 副本攻略</title>
    <style>
        /* 样式与 index.html 完全一致，此处省略重复以节省篇幅，实际部署需复制完整样式 */
        /* 实际使用时请将 index.html 中的 <style> 完整复制到此处 */
        /* 为保持完整性，下面直接嵌入完整样式（与 index.html 相同） */

    <!-- 由于实际输出需完整，以下为完整样式（实际代码中会复制全部） -->
    <style>
        /* ============================================================
           黑金主题配色 (Black & Gold) — 全局共用样式
           ============================================================ */
        :root {
            --bg: #0b0a08;
            --bg-deep: #050403;
            --surface: rgba(24, 20, 16, .86);
            --surface-strong: #1f1812;
            --surface-soft: rgba(255, 215, 140, .06);
            --line: rgba(212, 163, 115, .22);
            --text: #f2eee9;
            --muted: #b8aa98;
            --gold: #d4a373;
            --gold-bright: #eac784;
            --gold-deep: #b8863a;
            --gold-glow: rgba(212, 163, 115, .35);
            --shadow: 0 28px 80px rgba(0, 0, 0, .6);
            --radius-lg: 28px;
            --radius-md: 20px;
            --radius-sm: 14px;
            --container: 1160px;
            --font: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            min-width: 320px;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 5%, rgba(212, 163, 115, .10), transparent 30rem),
                radial-gradient(circle at 90% 20%, rgba(184, 134, 58, .07), transparent 35rem),
                linear-gradient(180deg, var(--bg) 0%, #12100c 48%, var(--bg-deep) 100%);
            font-family: var(--font);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: .18;
            background-image:
                linear-gradient(rgba(212, 163, 115, .06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 163, 115, .06) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: linear-gradient(to bottom, black, transparent 78%);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 4px;
            border-radius: 8px;
        }

        .container {
            width: min(calc(100% - 40px), var(--container));
            margin-inline: auto;
        }

        /* ===== 头部 ===== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid rgba(212, 163, 115, .18);
            background: rgba(11, 10, 8, .82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .header-inner {
            min-height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex: 0 0 auto;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .04em;
            color: var(--gold-bright);
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(212, 163, 115, .5);
            border-radius: 13px;
            color: #1f1a14;
            background: linear-gradient(135deg, #f7e0b5, var(--gold));
            box-shadow: 0 10px 30px rgba(212, 163, 115, .28);
            font-family: "STKaiti", "KaiTi", serif;
            font-size: 23px;
            font-weight: 900;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin: 0;
            padding: 0;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            display: block;
            padding: 9px 13px;
            border-radius: 11px;
            color: var(--muted);
            font-size: 14px;
            transition: color .2s ease, background .2s ease;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a[aria-current="page"],
        .nav-links a.active-section {
            color: var(--gold-bright);
            background: rgba(212, 163, 115, .12);
        }

        /* ===== 英雄区 ===== */
        .hero {
            position: relative;
            padding-block: 72px 48px;
            text-align: center;
        }

        .hero::after {
            content: "";
            position: absolute;
            right: -12%;
            top: 2%;
            width: 480px;
            height: 480px;
            z-index: -1;
            border: 1px solid rgba(212, 163, 115, .13);
            border-radius: 50%;
            box-shadow: 0 0 0 48px rgba(212, 163, 115, .03), 0 0 0 112px rgba(212, 163, 115, .02);
            pointer-events: none;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 22px;
            padding: 7px 16px;
            border: 1px solid rgba(212, 163, 115, .35);
            border-radius: 999px;
            color: #f5e2c7;
            background: rgba(212, 163, 115, .10);
            font-size: 12px;
            font-weight: 750;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 16px var(--gold);
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(40px, 5.4vw, 68px);
            line-height: 1.08;
            letter-spacing: -.055em;
        }

        .hero h1 span {
            display: block;
            color: transparent;
            background: linear-gradient(100deg, #f7e5c4 6%, var(--gold-bright) 48%, #f7d89e 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .hero-copy {
            max-width: 640px;
            margin: 20px auto 0;
            color: var(--muted);
            font-size: clamp(16px, 1.6vw, 19px);
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 24px;
            margin-top: 28px;
            color: #b8aa98;
            font-size: 13px;
        }

        .hero-meta span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .hero-meta span::before {
            content: "✦";
            color: var(--gold);
            font-weight: 900;
        }

        /* ===== 通用 Section ===== */
        .section {
            padding-block: 56px;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 30px;
        }

        .section-kicker {
            margin: 0 0 6px;
            color: var(--gold);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .section-heading h2 {
            margin: 0;
            font-size: clamp(28px, 3.6vw, 40px);
            line-height: 1.18;
            letter-spacing: -.035em;
        }

        .section-heading>p {
            max-width: 400px;
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* ===== 卡片网格 ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .card-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 26px 28px 28px;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--surface);
            box-shadow: 0 18px 55px rgba(0, 0, 0, .25);
            cursor: default;
            transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .3s ease;
        }

        .card-item::after {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            right: -70px;
            bottom: -80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 163, 115, .12), transparent 68%);
            transition: transform .3s ease;
            pointer-events: none;
        }

        .card-item:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            background: rgba(30, 24, 18, .94);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .4);
        }

        .card-item:hover::after {
            transform: scale(1.3);
        }

        .card-item .card-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            margin-bottom: 18px;
            border: 1px solid rgba(212, 163, 115, .2);
            border-radius: 14px;
            color: var(--gold-bright);
            background: linear-gradient(145deg, rgba(212, 163, 115, .16), rgba(212, 163, 115, .05));
            font-family: "STKaiti", "KaiTi", serif;
            font-size: 21px;
            font-weight: 900;
        }

        .card-item h3 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -.015em;
        }

        .card-item .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 12px;
        }

        .card-item .tag {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(212, 163, 115, .14);
            color: #f5e2c7;
            border: 1px solid rgba(212, 163, 115, .12);
        }

        .card-item .tag.event {
            background: rgba(212, 163, 115, .10);
            color: #eacba1;
            border-color: rgba(212, 163, 115, .08);
        }

        .card-item .card-desc {
            margin: 4px 0 16px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
            flex: 1;
        }

        .card-item .card-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gold-bright);
            font-size: 14px;
            font-weight: 750;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(212, 163, 115, .12);
            width: 100%;
            justify-content: flex-end;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn .25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-box {
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: var(--radius-lg);
            background: linear-gradient(145deg, rgba(22, 18, 14, .96), rgba(10, 8, 6, .98));
            border: 1px solid rgba(212, 163, 115, .2);
            box-shadow: 0 40px 100px rgba(0, 0, 0, .7);
            padding: 0;
            animation: slideUp .3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 30px 16px;
            border-bottom: 1px solid rgba(212, 163, 115, .15);
            position: sticky;
            top: 0;
            background: rgba(10, 8, 6, .92);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            z-index: 2;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: -.02em;
            color: var(--gold-bright);
        }

        .modal-close {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 50%;
            background: rgba(212, 163, 115, .08);
            color: var(--muted);
            font-size: 22px;
            cursor: pointer;
            transition: background .2s, color .2s, transform .2s;
        }

        .modal-close:hover {
            background: rgba(212, 163, 115, .18);
            color: var(--gold-bright);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 24px 30px 30px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.7;
        }

        .modal-body .guide-section {
            margin-bottom: 20px;
        }

        .modal-body .guide-section strong {
            color: var(--gold-bright);
        }

        .modal-body .guide-section .content {
            margin-top: 6px;
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(0, 0, 0, .3);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--gold);
            font-size: 14px;
        }

        /* ===== 页脚 ===== */
        .site-footer {
            padding-block: 28px 38px;
            border-top: 1px solid rgba(212, 163, 115, .12);
            color: #8a7e70;
            font-size: 12px;
        }

        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 26px;
            flex-wrap: wrap;
        }

        .footer-brand {
            color: #b8aa98;
            font-weight: 750;
        }

        .notice {
            max-width: 720px;
            margin: 0;
            text-align: right;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            border: 2px dashed rgba(212, 163, 115, .15);
            border-radius: var(--radius-md);
        }

        .empty-state .big-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: .5;
        }

        .empty-state h3 {
            color: var(--text);
            font-size: 20px;
            margin-bottom: 8px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(22, 18, 14, .94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 163, 115, .2);
            border-radius: 12px;
            padding: 12px 28px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
            opacity: 0;
            transition: opacity .4s ease, transform .4s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .check {
            color: var(--gold);
            margin-right: 10px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .header-inner {
                min-height: auto;
                padding-block: 13px;
                align-items: flex-start;
                flex-wrap: wrap;
            }
            .nav-links {
                max-width: 560px;
            }
            .section-heading {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .section-heading>p {
                max-width: 100%;
            }
            .hero::after {
                width: 300px;
                height: 300px;
                right: -10%;
            }
        }

        @media (max-width: 680px) {
            .container {
                width: min(calc(100% - 28px), var(--container));
            }
            .site-header {
                position: relative;
            }
            .header-inner {
                display: block;
            }
            .nav-links {
                justify-content: flex-start;
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid rgba(212, 163, 115, .12);
            }
            .nav-links a {
                padding: 6px 10px;
                font-size: 12px;
            }
            .hero {
                padding-block: 48px 32px;
            }
            .hero h1 {
                font-size: clamp(34px, 10vw, 48px);
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .modal-box {
                max-height: 95vh;
                border-radius: var(--radius-md);
            }
            .modal-header {
                padding: 16px 18px 12px;
            }
            .modal-body {
                padding: 16px 18px 22px;
            }
            .footer-inner {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .notice {
                text-align: left;
            }
        }

        /* ===== 滚动条美化 ===== */
        .modal-box::-webkit-scrollbar,
        .code-block-wrap pre::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .modal-box::-webkit-scrollbar-track,
        .code-block-wrap pre::-webkit-scrollbar-track {
            background: rgba(212, 163, 115, .06);
            border-radius: 9px;
        }

        .modal-box::-webkit-scrollbar-thumb,
        .code-block-wrap pre::-webkit-scrollbar-thumb {
            background: rgba(212, 163, 115, .3);
            border-radius: 9px;
        }

        .modal-box::-webkit-scrollbar-thumb:hover,
        .code-block-wrap pre::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 163, 115, .5);
        }
    </style>
</head>

            guide: `**普通：**此时所在山谷有三个分岔，北边是白虎堂，东边是树林，南边是青龙堂。先去北边最里面击杀白虎堂长老上官云（随机爆上官云的披风，不如盟主披风），收集白虎堂令牌。去南边最深处击杀青龙堂长老贾布（随机爆贾布的护腰锁，没p用），收集青龙堂令牌。回到山谷，向东走到树林同样有三个分岔，北边是风雷堂，东边是悬崖，南边是天香堂。天香堂不用管，直接去北边风雷堂最深处击杀风雷堂长老童百熊，收集风雷堂令牌。接下来到悬崖，房间描述"[匣子]"，插入白虎堂令牌出现吊篮，通过吊篮到下一个悬崖，接下来都一样，依次插入青龙堂令牌、风雷堂令牌后来到大门（三位长老并不是必爆令牌，如果缺少其中一个令牌，请出副本重新打），向东走有杨莲亭拦路，杀。到后厅，房间描述"[碗]"，转动打开密道，到了密道后需要火折子点亮，才能找到铁环，拉动打开小花园后，东边出现闺房，东方不败就在这里，另外杨莲亭也在这。进入闺房后杨莲亭和东方不败会主动叫杀，你会优先击杀杨莲亭，杨莲亭死后东方不败获得狂暴buff，并且马上开启鬼魅，狂暴状态持续时间大概在30s左右，不论是凌波跑路，还是天师符复活，杨莲亭都会复活帮东方不败挡刀。\n这里可以推荐使用绿色武功：唐诗剑法。\n进闺房之前先装备好唐诗剑法，击杀杨莲亭后立马使用躺尸（但是你如果没来得及躺尸而使用天师符复活，那么杨莲亭也会复活）。躺尸结束后东方不败不会攻击你，杨莲亭也不会复活，并且触发狂暴buff秒开鬼魅。\n若是你没有击杀杨莲亭，东方不败就没有狂暴buff。而在这个时候，不管你有没有击杀杨莲亭，只要使用了唐诗剑法，此时就是你的时间，换回主攻剑法，不管杨莲亭在不在，你叫杀东方不败时，这时的他不会替东方不败挡刀。击杀两货，完成度100%。\n**困难：**进困难之前先到普通黑木崖刷齐三个令牌，因为困难黑木崖需要三个令牌上崖后才能见到3位堂主（所以要先有令牌），然后1v3。就这个地方和普通不一样，击杀东方不败和杨莲亭以后，完成度100%`

            guide: `**第一种方法缥缈峰攻略：**\n**普通：**先杀乌道老大，后杀不平道人，之后杀卓不凡，然后回来和女童切磋开鹤翔、神行马上过桥，去到李秋水那等女童下来，叫杀李秋水，接控，一套打死，然后在战斗描述界面把女童背起来（注意:直接点女童没有背起选项，打死李秋水后，在战斗描述界面才会出现背起选项，所以要在战斗描述界面直接点），一路飞奔到闭关室，100%过关。\n**第二种方法缥缈峰攻略（第二种方法来源于二营长）：**\n**参考数据：①逍遥（利用卓不凡开启凌波过桥）。②逍遥以外的门派（紫色逍遥套《打满+50闪避的蓝宝石》、50先天身法、装备加高身法的技能《如明玉轻功、飞星术等》、无buff闪避15000、明玉30%、五神剑37%、如果自身闪避底可以吃闪避宴席）。③如果明玉功、五神剑、飞星术都没有，建议去刷一本神行百变，有10000基础面板闪避，开启神行后便可过桥。**\n**普通：**进入副本后，向上走一步看见乌老大和不平道人直接击杀，速度要快否则女童会被2个小怪秒杀。（也可以先背起后击杀2个小怪）。击杀小怪后，背负女童，背负后四维属性降低-100%，各属性降成0，而过铁索桥硬性需求10000闪避。满足过桥条件后，可以利用卓不凡来开启五神剑刷翔鹤凌波等技能，（如果在卓不凡处跑不掉，可以不背女童，先杀了卓不凡，和女童比试刷buff后在背起他），过桥后李秋水拦路，等待女童从你背上下来后，玩家则恢复自身属性，李秋水会叫杀天山童姥，这里需要保护童姥，并且杀死李秋水。\n李秋水会各种逍遥派技能，其中白虹威胁巨大，这里只能看脸童姥是否开启凌波。击杀李秋水后，童姥会叫你背起她，选项在战斗描述界面里。背起后一路向上到闭关室即可完成，如果卓不凡还没杀记得下来杀了在完成副本。\n**困难：**过桥条件一样，抵达李秋水处天山童来还为从身上下来前，叫杀李秋水。击杀后到闭关室可以100%，也就是你在背负-100%的情况下击杀李秋水。`

        // ================================================================

        const gridGuides = document.getElementById('guidesGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const modalTitle = document.getElementById('modalTitle');
        const modalClose = document.getElementById('modalClose');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // ---- 渲染攻略卡片 ----
        function renderGuides() {
            if (dungeonData.length === 0) {
                gridGuides.innerHTML = `<div class="empty-state"><div class="big-icon">📜</div><h3>暂无攻略</h3></div>`;
                return;
            }
            let html = '';
            dungeonData.forEach(d => {
                html += `
                <div class="card-item" data-id="${d.id}" data-type="guide">
                  <span class="card-icon">⚔</span>
                  <h3>${escapeHtml(d.name)}</h3>
                  <div class="card-tags">
                    <span class="tag">${escapeHtml(d.stats || '无参考数据')}</span>
                  </div>
                  <p class="card-desc">${escapeHtml((d.drops || '').slice(0, 80))}${d.drops && d.drops.length > 80 ? '…' : ''}</p>
                  <span class="card-link">查看攻略 →</span>
                </div>`;
            });
            gridGuides.innerHTML = html;
            gridGuides.querySelectorAll('.card-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.id, 10);
                    const guide = dungeonData.find(d => d.id === id);
                    if (guide) openGuideModal(guide);
                });
            });
        }

        // ---- 打开攻略详情 ----
        function openGuideModal(guide) {
            modalTitle.textContent = guide.name + ' 攻略';
            let html = '';
            if (guide.drops) html += `<div class="guide-section"><strong>掉落</strong><div class="content">${escapeHtml(guide.drops)}</div></div>`;
            if (guide.stats) html += `<div class="guide-section"><strong>参考数据</strong><div class="content">${escapeHtml(guide.stats)}</div></div>`;
            if (guide.recommend) html += `<div class="guide-section"><strong>推荐刷取</strong><div class="content">${escapeHtml(guide.recommend)}</div></div>`;
            html += `<div class="guide-section"><strong>流程攻略</strong><div class="content" style="white-space:pre-wrap;">${escapeHtml(guide.guide)}</div></div>`;
            modalBody.innerHTML = html;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ---- 关闭模态框 ----
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ---- Toast ----
        let toastTimer = null;

        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ---- 转义 ----
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---- 点击模态框外部关闭 ----
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        modalClose.addEventListener('click', closeModal);

        // ---- 初始化 ----
        renderGuides();
        console.log('📜 副本攻略已加载！');
    </script>

</body>
</html>
