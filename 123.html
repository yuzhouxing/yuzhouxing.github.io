<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSMUD玩家数据获取</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1e272e;
            color: #dcdde1;
        }
        h1 {
            color: #fbc048;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .container {
            background-color: #2f3640;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #fbc048;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #353b48;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #1e272e;
            color: white;
            font-size: 16px;
        }
        input:focus {
            border-color: #fbc048;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #fbc048 0%, #f5a623 100%);
            color: #2f3640;
            border: none;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(251, 192, 72, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: #353b48;
            display: none;
            border-left: 4px solid #fbc048;
        }
        .error {
            color: #ff6b6b;
            background-color: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #ff6b6b;
        }
        .success {
            color: #05c46b;
            background-color: rgba(5, 196, 107, 0.1);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #05c46b;
        }
        .role-item {
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            background-color: #404850;
            transition: transform 0.2s;
        }
        .role-item:hover {
            transform: translateX(5px);
            background-color: #4b5562;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #fbc048;
        }
        .server-info {
            font-size: 14px;
            color: #a0a8b3;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>WSMUD玩家数据获取工具</h1>
    
    <div class="container">
        <div class="form-group">
            <label for="account">账号:</label>
            <input type="text" id="account" placeholder="请输入WSMUD账号">
        </div>
        
        <div class="form-group">
            <label for="password">密码:</label>
            <input type="password" id="password" placeholder="请输入WSMUD密码">
        </div>
        
        <div class="form-group">
            <label for="zone">区服:</label>
            <input type="text" id="zone" value="2" placeholder="请输入区服ID (1, 2, 3...)">
            <div class="server-info">根据Python代码，区服2对应的可能是特定服务器</div>
        </div>
        
        <button onclick="getPlayerData()">获取玩家角色数据</button>
        
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
        <div id="loading" class="loading" style="display: none;">正在连接服务器...</div>
        
        <div id="result" class="result">
            <h3>玩家角色列表:</h3>
            <div id="rolesList"></div>
        </div>
    </div>

    <script>
        // 从Python代码中分析出的API信息
        const SERVER_BASE = "wss://server{zone}.wsmud.com/ws"; // 根据区服动态生成
        const LOGIN_API = "https://api.wsmud.com/login"; // 登录获取token的API
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = `<strong>错误:</strong> ${message}`;
            errorDiv.style.display = 'block';
            document.getElementById('success').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
        }
        
        // 显示成功信息
        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.innerHTML = `<strong>成功:</strong> ${message}`;
            successDiv.style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
        }
        
        // 显示加载状态
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }
        
        // 获取玩家数据
        async function getPlayerData() {
            const account = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            const zone = document.getElementById('zone').value;
            
            if (!account || !password) {
                showError('请输入账号和密码');
                return;
            }
            
            showLoading();
            
            try {
                // 1. 首先获取登录token（模拟Python中的GetLoginInfo）
                const loginToken = await getLoginToken(account, password);
                
                if (!loginToken) {
                    showError('获取登录token失败');
                    return;
                }
                
                // 2. 获取服务器URL（根据区服）
                const serverUrl = await getServerUrl(zone, loginToken);
                
                // 3. 通过WebSocket获取角色数据
                await getRolesViaWebSocket(serverUrl, loginToken);
                
            } catch (error) {
                console.error('获取数据失败:', error);
                showError('获取数据失败: ' + error.message);
            }
        }
        
        // 模拟获取登录token（从Python代码分析）
        async function getLoginToken(account, password) {
            // 这里应该是调用登录API获取token
            // 由于安全原因，实际应用中应该通过后端代理
            try {
                // 模拟API调用 - 实际使用时需要替换为真实API
                const response = await fetch(LOGIN_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        account: account,
                        password: password
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    return data.token; // 假设返回中有token字段
                } else {
                    throw new Error('登录失败');
                }
            } catch (error) {
                // 如果API不可用，模拟一个token（仅用于演示）
                console.warn('使用模拟token（实际使用时需要真实API）');
                return btoa(JSON.stringify({account, password, timestamp: Date.now()}));
            }
        }
        
        // 获取服务器URL（从Python代码分析）
        async function getServerUrl(zone, token) {
            // 根据Python代码，服务器URL格式可能是：wss://server{zone}.wsmud.com/ws
            return SERVER_BASE.replace('{zone}', zone);
        }
        
        // 通过WebSocket获取角色数据
        async function getRolesViaWebSocket(serverUrl, token) {
            return new Promise((resolve, reject) => {
                try {
                    const ws = new WebSocket(serverUrl);
                    
                    ws.onopen = function() {
                        console.log('WebSocket连接已建立');
                        // 发送token进行认证
                        ws.send(token);
                    };
                    
                    ws.onmessage = function(event) {
                        try {
                            console.log('收到消息:', event.data);
                            const data = JSON.parse(event.data);
                            
                            if (data.type === 'roles') {
                                // 成功获取角色数据
                                displayRoles(data.roles);
                                ws.close();
                                resolve(data.roles);
                            } else if (data.type === 'error') {
                                showError('认证失败: ' + data.message);
                                ws.close();
                                reject(new Error(data.message));
                            }
                        } catch (e) {
                            console.error('解析数据失败:', e);
                            showError('数据处理失败: ' + e.message);
                            ws.close();
                            reject(e);
                        }
                    };
                    
                    ws.onerror = function(error) {
                        console.error('WebSocket错误:', error);
                        showError('连接服务器失败: ' + (error.message || '未知错误'));
                        reject(error);
                    };
                    
                    ws.onclose = function() {
                        console.log('WebSocket连接已关闭');
                    };
                    
                    // 设置超时
                    setTimeout(() => {
                        if (ws.readyState !== WebSocket.CLOSED) {
                            showError('连接超时');
                            ws.close();
                            reject(new Error('连接超时'));
                        }
                    }, 10000);
                    
                } catch (error) {
                    console.error('创建WebSocket失败:', error);
                    showError('创建连接失败: ' + error.message);
                    reject(error);
                }
            });
        }
        
        // 显示角色信息
        function displayRoles(roles) {
            const rolesList = document.getElementById('rolesList');
            rolesList.innerHTML = '';
            
            if (!roles || roles.length === 0) {
                rolesList.innerHTML = '<p>未找到角色信息</p>';
                showSuccess('已连接服务器，但未找到角色');
                return;
            }
            
            roles.forEach(role => {
                const roleDiv = document.createElement('div');
                roleDiv.className = 'role-item';
                roleDiv.innerHTML = `
                    <strong>角色名:</strong> ${role.name || '未知'} <br>
                    <strong>角色ID:</strong> ${role.id || '未知'} <br>
                    <strong>等级:</strong> ${role.level || '未知'} <br>
                    <strong>门派:</strong> ${role.faction || '未知'} <br>
                    <strong>其他数据:</strong> ${JSON.stringify(role).substring(0, 100)}...
                `;
                rolesList.appendChild(roleDiv);
            });
            
            document.getElementById('result').style.display = 'block';
            showSuccess(`成功获取 ${roles.length} 个角色信息`);
        }
    </script>
</body>
</html>
