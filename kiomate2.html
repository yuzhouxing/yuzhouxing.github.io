<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KioMate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #0a0e17;
            color: #ecf0f1;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* 游戏容器 */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e17;
            z-index: 1;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 380px;
            background: rgba(26, 37, 48, 0.97);
            z-index: 900;
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }
        
        .left-sidebar {
            left: 0;
            transform: translateX(-100%);
        }
        
        .left-sidebar.active {
            transform: translateX(0);
        }
        
        /* 浮动按钮 */
        .float-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 800;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            font-size: 20px;
        }
        
        .float-btn:hover {
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        
        /* 小部件样式 */
        .widget {
            background: rgba(39, 55, 70, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .widget-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #3498db;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .timer-display {
            font-size: 24px;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: rgba(26, 37, 48, 0.5);
            padding: 12px;
            border-radius: 6px;
            margin: 8px 0;
            color: #2ecc71;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .timer-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        button {
            background: linear-gradient(to right, #3498db, #2ecc71);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            flex: 1;
            font-size: 14px;
        }
        
        button:hover {
            background: linear-gradient(to right, #2980b9, #27ae60);
        }
        
        textarea {
            width: 100%;
            height: 80px;
            background: rgba(26, 37, 48, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
            color: #e0e0e0;
            resize: vertical;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .translation-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .language-selectors {
            display: flex;
            gap: 8px;
        }
        
        select {
            flex: 1;
            padding: 8px;
            background: rgba(26, 37, 48, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        .translation-frame-container {
            height: 200px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .translation-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .api-status {
            margin-top: 8px;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
        }
        
        .status-online {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        
        .shortcut-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        
        .shortcut-item:last-child {
            border-bottom: none;
        }
        
        .key {
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #3498db;
            font-size: 13px;
        }
        
        /* 聊天室样式 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: auto;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            max-height: 200px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(26, 37, 48, 0.5);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .chat-message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 6px;
            background: rgba(52, 152, 219, 0.2);
        }
        
        .message-sender {
            font-weight: bold;
            color: #3498db;
            margin-bottom: 4px;
        }
        
        .message-content {
            font-size: 14px;
        }
        
        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-align: right;
            margin-top: 4px;
        }
        
        .chat-input-container {
            display: flex;
            gap: 8px;
        }
        
        .chat-input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(26, 37, 48, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .chat-send {
            background: linear-gradient(to right, #3498db, #2ecc71);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 90%;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(26, 37, 48, 0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(52, 152, 219, 0.5);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #3498db;
        }
    </style>
</head>
<body>

    <!-- 游戏容器 -->
    <div class="game-container">
        <iframe src="https://kiomet.com" class="game-frame" id="kiometFrame"></iframe>
    </div>

    <!-- 左侧工具栏 -->
    <div class="sidebar left-sidebar" id="leftSidebar">
        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-clock"></i> kiomet计时器</h3>
            <div class="timer-display">
                <span id="timer">00:00:00</span>
            </div>
            <div class="timer-controls">
                <button id="startTimer"><i class="fas fa-play"></i> 开始</button>
                <button id="pauseTimer"><i class="fas fa-pause"></i> 暂停</button>
                <button id="resetTimer"><i class="fas fa-redo"></i> 重置</button>
            </div>
        </div>

        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-sticky-note"></i> kiomet聊天编辑器</h3>
            <textarea id="gameNotes" placeholder="解决kiomet聊天框难以操作问题"></textarea>
            <button id="saveNotes" style="margin-top: 10px;"><i class="fas fa-save"></i> 保存内容</button>
        </div>
        
        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-language"></i> 百度翻译</h3>
            <div class="translation-container">
                <div class="language-selectors">
                    <select id="sourceLang">
                        <option value="auto">自动检测</option>
                        <option value="zh">中文</option>
                        <option value="en">英语</option>
                    </select>
                    <select id="targetLang">
                        <option value="en">英语</option>
                        <option value="zh">中文</option>
                    </select>
                </div>
                
                <div class="translation-frame-container">
                    <iframe 
                        src="https://fanyi.baidu.com/m/trans" 
                        class="translation-frame" 
                        id="baiduTranslateFrame"
                        sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
                        loading="lazy">
                    </iframe>
                </div>
                
                <div class="api-status status-online">
                    <i class="fas fa-check-circle"></i> 百度翻译已加载
                </div>
            </div>
        </div>
        
        <div class="widget">
            <h3 class="widget-title"><i class="fas fa-keyboard"></i> 游戏快捷键</h3>
            <div class="shortcut-list">
                <div class="shortcut-item">
                    <span>定位国王</span>
                    <span class="key">H</span>
                </div>
                <div class="shortcut-item">
                    <span>显示兵线</span>
                    <span class="key">R</span>
                </div>
                <div class="shortcut-item">
                    <span>搜索同类单位</span>
                    <span class="key">G</span>
                </div>
            </div>
        </div>
        
        <!-- Supabase聊天功能 -->
        <div class="chat-container">
            <h3 class="widget-title"><i class="fas fa-comments"></i> KioMate交流框</h3>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message">
                    <div class="message-sender">系统</div>
                    <div class="message-content">欢迎使用KioMate！聊天功能已修复。</div>
                    <div class="message-time">刚刚</div>
                </div>
            </div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="输入消息..." />
                <button class="chat-send" id="chatSend">发送</button>
            </div>
        </div>
    </div>

    <!-- 浮动按钮 -->
    <div class="float-buttons">
        <button class="float-btn" id="floatToggle">
            <i class="fas fa-bars" id="toggleIcon"></i>
        </button>
    </div>

    <script>
        // Supabase初始化
        const supabaseUrl = 'https://meeuseqgrbegaalrayeu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lZXVzZXFncmJlZ2FhbHJheWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYxMzI0MjUsImV4cCI6MjA3MTcwODQyNX0.DSLAtwP-vrFYyVeBH0l9_tyoQF2rHHW6jPcnsQ7dKEM';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // 侧边栏切换功能
        const leftSidebar = document.getElementById('leftSidebar');
        const floatToggle = document.getElementById('floatToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        
        function toggleSidebar() {
            const isActive = leftSidebar.classList.contains('active');
            if (isActive) {
                leftSidebar.classList.remove('active');
                toggleIcon.className = 'fas fa-bars';
            } else {
                leftSidebar.classList.add('active');
                toggleIcon.className = 'fas fa-times';
            }
        }
        
        floatToggle.addEventListener('click', toggleSidebar);
        
        // 点击游戏区域关闭侧边栏
        document.querySelector('.game-container').addEventListener('click', () => {
            leftSidebar.classList.remove('active');
            toggleIcon.className = 'fas fa-bars';
        });
        
        // 计时器功能
        let timerInterval;
        let timerRunning = false;
        let seconds = 0, minutes = 0, hours = 0;
        
        const timerDisplay = document.getElementById('timer');
        const startTimerBtn = document.getElementById('startTimer');
        const pauseTimerBtn = document.getElementById('pauseTimer');
        const resetTimerBtn = document.getElementById('resetTimer');
        
        function updateTimer() {
            seconds++;
            if (seconds >= 60) {
                seconds = 0;
                minutes++;
                if (minutes >= 60) {
                    minutes = 0;
                    hours++;
                }
            }
            
            timerDisplay.textContent = 
                (hours ? (hours > 9 ? hours : "0" + hours) : "00") + ":" + 
                (minutes ? (minutes > 9 ? minutes : "0" + minutes) : "00") + ":" + 
                (seconds > 9 ? seconds : "0" + seconds);
        }
        
        startTimerBtn.addEventListener('click', () => {
            if (!timerRunning) {
                timerInterval = setInterval(updateTimer, 1000);
                timerRunning = true;
            }
        });
        
        pauseTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
        });
        
        resetTimerBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            seconds = 0; minutes = 0; hours = 0;
            timerDisplay.textContent = "00:00:00";
        });
        
        // 笔记保存功能
        const gameNotes = document.getElementById('gameNotes');
        const saveNotesBtn = document.getElementById('saveNotes');
        
        // 加载保存的笔记
        const savedNotes = localStorage.getItem('kiometNotes');
        if (savedNotes) {
            gameNotes.value = savedNotes;
        }
        
        saveNotesBtn.addEventListener('click', () => {
            localStorage.setItem('kiometNotes', gameNotes.value);
            saveNotesBtn.innerHTML = '<i class="fas fa-check"></i> 已保存!';
            setTimeout(() => {
                saveNotesBtn.innerHTML = '<i class="fas fa-save"></i> 保存内容';
            }, 2000);
        });
        
        // Supabase聊天功能
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSend = document.getElementById('chatSend');
        
        // 生成随机用户名
        function generateRandomName() {
            const prefixes = ['勇敢的', '聪明的', '敏捷的', '强大的', '神秘的'];
            const nouns = ['战士', '法师', '弓箭手', '刺客', '骑士'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            return prefix + noun + Math.floor(Math.random() * 1000);
        }
        
        // 获取或创建用户名
        let username = localStorage.getItem('kiometUsername');
        if (!username) {
            username = generateRandomName();
            localStorage.setItem('kiometUsername', username);
        }
        
        // 发送消息
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            // 显示发送中的消息
            const tempId = 'temp-' + Date.now();
            const tempMessage = {
                id: tempId,
                username: username,
                message: message,
                timestamp: new Date().toISOString()
            };
            addMessageToChat(tempMessage);
            
            chatInput.value = '';
            
            try {
                // 发送到Supabase
                const { data, error } = await supabase
                    .from('kiomet_chat')
                    .insert([
                        { 
                            username: username, 
                            message: message 
                        }
                    ])
                    .select();
                
                if (error) {
                    console.error('发送消息错误:', error);
                    // 标记失败的消息
                    const tempMsgElement = document.getElementById(tempId);
                    if (tempMsgElement) {
                        tempMsgElement.style.opacity = '0.5';
                        tempMsgElement.querySelector('.message-content').textContent = 
                            '发送失败: ' + message;
                    }
                } else {
                    // 删除临时消息
                    const tempMsgElement = document.getElementById(tempId);
                    if (tempMsgElement) {
                        tempMsgElement.remove();
                    }
                    // 添加服务器返回的消息（包含正确ID）
                    addMessageToChat(data[0]);
                }
            } catch (err) {
                console.error('发送消息异常:', err);
            }
        }
        
        // 按Enter发送消息
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 点击发送按钮
        chatSend.addEventListener('click', sendMessage);
        
        // 接收实时消息
        supabase
            .channel('kiomet_chat_channel')
            .on('postgres_changes', 
                { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'kiomet_chat' 
                }, 
                (payload) => {
                    addMessageToChat(payload.new);
                }
            )
            .subscribe();
        
        // 定期刷新消息（每秒一次）
        let refreshInterval = setInterval(loadMessages, 1000);
        
        // 加载历史消息
        async function loadMessages() {
            try {
                const { data, error } = await supabase
                    .from('kiomet_chat')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(20);
                
                if (error) {
                    console.error('加载消息错误:', error);
                    return;
                }
                
                // 清空当前消息（除了系统消息）
                const systemMessage = chatMessages.querySelector('.chat-message:first-child');
                chatMessages.innerHTML = '';
                if (systemMessage) {
                    chatMessages.appendChild(systemMessage);
                }
                
                // 添加历史消息（逆序）
                data.reverse().forEach(addMessageToChat);
                
                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                console.error('加载消息异常:', err);
            }
        }
        
        // 添加消息到聊天窗口
        function addMessageToChat(messageData) {
            // 检查是否已存在相同消息
            const existingMessage = document.getElementById(messageData.id);
            if (existingMessage) {
                return; // 避免重复添加
            }
            
            const messageElement = document.createElement('div');
            messageElement.className = 'chat-message';
            messageElement.id = messageData.id || 'msg-' + Date.now();
            
            const senderElement = document.createElement('div');
            senderElement.className = 'message-sender';
            senderElement.textContent = messageData.username || '匿名用户';
            
            const contentElement = document.createElement('div');
            contentElement.className = 'message-content';
            contentElement.textContent = messageData.message;
            
            const timeElement = document.createElement('div');
            timeElement.className = 'message-time';
            timeElement.textContent = formatTime(messageData.timestamp || messageData.created_at);
            
            messageElement.appendChild(senderElement);
            messageElement.appendChild(contentElement);
            messageElement.appendChild(timeElement);
            
            chatMessages.appendChild(messageElement);
            
            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '未知时间';
            
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) { // 1分钟内
                return '刚刚';
            } else if (diff < 3600000) { // 1小时内
                return Math.floor(diff / 60000) + '分钟前';
            } else if (diff < 86400000) { // 1天内
                return Math.floor(diff / 3600000) + '小时前';
            } else {
                return date.toLocaleDateString();
            }
        }
        
        // 初始加载消息
        loadMessages();
        
        // 快捷键支持
        document.addEventListener('keydown', (e) => {
            // T键 显示/隐藏侧边栏
            if (e.key === 't' || e.key === 'T') {
                e.preventDefault();
                toggleSidebar();
            }
            
            // ESC键关闭侧边栏
            if (e.key === 'Escape') {
                leftSidebar.classList.remove('active');
                toggleIcon.className = 'fas fa-bars';
            }
        });
    </script>
</body>
</html>
