<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅圈工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            transition: all 0.3s ease;
        }

        /* 移动端菜单按钮 */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 1001;
            font-size: 24px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        /* 左侧目录 */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.08);
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.15);
        }

        .logo h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .logo p {
            color: #718096;
            font-size: 14px;
            opacity: 0.8;
        }

        .menu {
            flex: 1;
        }

        .menu-item {
            padding: 16px 20px;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            color: #4a5568;
            text-decoration: none;
            font-weight: 500;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 16px;
        }

        .menu-item:hover {
            background: rgba(102, 126, 234, 0.08);
            transform: translateX(5px);
        }

        .menu-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25);
        }

        .menu-icon {
            font-size: 20px;
            margin-right: 12px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .coming-soon {
            margin-top: auto;
            text-align: center;
            color: #a0aec0;
            font-size: 13px;
            padding: 20px 0;
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }

        /* 主内容区 */
        .main-content {
            margin-left: 280px;
            min-height: 100vh;
            padding: 0;
            transition: margin-left 0.3s ease;
        }

        .content-frame {
            width: 100%;
            height: 100vh;
            border: none;
            background: white;
            display: block;
        }

        /* 隐藏其他iframe - 关键修改 */
        .hidden-iframe {
            display: none !important;
        }

        /* 移动端遮罩 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            backdrop-filter: blur(3px);
        }

        /* 移动端样式 */
        @media (max-width: 1024px) {
            .sidebar {
                width: 260px;
            }
            .main-content {
                margin-left: 260px;
            }
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: flex;
            }
            
            .sidebar {
                width: 280px;
                transform: translateX(-100%);
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
            }
            
            .sidebar.active {
                transform: translateX(0);
            }
            
            .sidebar-overlay.active {
                display: block;
            }
            
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            
            .content-frame {
                height: calc(100vh - 60px);
                margin-top: 60px;
                border-radius: 0;
            }
            
            /* 移动端菜单打开时的body滚动锁定 */
            body.menu-open {
                overflow: hidden;
            }
            
            .logo {
                margin-bottom: 30px;
                padding-bottom: 15px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
            
            .menu-item {
                padding: 14px 18px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 85%;
                max-width: 300px;
            }
            
            .mobile-menu-toggle {
                top: 15px;
                left: 15px;
                width: 45px;
                height: 45px;
                font-size: 22px;
            }
            
            .content-frame {
                height: calc(100vh - 50px);
                margin-top: 50px;
            }
        }

        /* 小屏幕设备优化 */
        @media (max-height: 600px) {
            .logo {
                margin-bottom: 20px;
                padding-bottom: 15px;
            }
            
            .menu-item {
                padding: 12px 16px;
                margin: 6px 0;
            }
            
            .coming-soon {
                padding: 15px 0;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 移动端菜单按钮 -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>
    
    <!-- 移动端遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <!-- 左侧目录 -->
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <h1>🔧 雅圈工具箱</h1>
            <p>助力创作者，赋能内容生态</p>
        </div>
        
        <div class="menu">
            <button class="menu-item" data-target="intro.html">
                <span class="menu-icon">📚</span>
                <span>工具箱简介</span>
            </button>
            <button class="menu-item active" data-target="rankings.html">
                <span class="menu-icon">🏆</span>
                <span>创作者排行榜</span>
            </button>
            <button class="menu-item" data-target="wiki.html">
                <span class="menu-icon">🚀</span>
                <span>雅圈大事祭</span>
            </button>
            <button class="menu-item" data-target="coming.html">
                <span class="menu-icon">🚀</span>
                <span>敬请期待</span>
            </button>
        </div>
        
        <div class="coming-soon">
            更多功能开发中...
        </div>
    </div>

    <!-- 主内容区 - 始终显示排行榜 -->
    <div class="main-content">
        <!-- 所有iframe都加载，但只显示排行榜 -->
        <iframe id="contentFrameRankings" class="content-frame" 
                title="创作者排行榜"
                src="rankings.html"
                allowfullscreen></iframe>
        
        <iframe id="contentFrameIntro" class="content-frame hidden-iframe" 
                title="工具箱简介"
                allowfullscreen></iframe>

        <iframe id="contentFrameIntro" class="content-frame hidden-iframe" 
                title="雅圈大事祭"
                allowfullscreen></iframe>
        
        <iframe id="contentFrameComing" class="content-frame hidden-iframe" 
                title="敬请期待"
                allowfullscreen></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuToggle = document.getElementById('mobileMenuToggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const menuItems = document.querySelectorAll('.menu-item');
            
            // 获取所有iframe
            const frameRankings = document.getElementById('contentFrameRankings');
            const frameIntro = document.getElementById('contentFrameIntro');
            const frameComing = document.getElementById('contentFrameComing');
            
            // iframe映射
            const frameMap = {
                'intro.html': frameIntro,
                'rankings.html': frameRankings,
                'wiki.html': frameWiki,
                'coming.html': frameComing
            };
            
            // 当前显示的iframe
            let currentFrame = frameRankings;
            
            // 移动端菜单切换
            function toggleMobileMenu() {
                sidebar.classList.toggle('active');
                sidebarOverlay.classList.toggle('active');
                document.body.classList.toggle('menu-open');
            }
            
            mobileMenuToggle.addEventListener('click', toggleMobileMenu);
            sidebarOverlay.addEventListener('click', toggleMobileMenu);
            
            // 菜单项点击事件
            menuItems.forEach(item => {
                item.addEventListener('click', function() {
                    const target = this.getAttribute('data-target');
                    
                    // 更新菜单激活状态
                    menuItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 切换到对应的iframe
                    switchToFrame(target);
                    
                    // 移动端点击后关闭菜单
                    if (window.innerWidth <= 768) {
                        toggleMobileMenu();
                    }
                    
                    // 更新页面标题
                    updatePageTitle(target);
                });
            });
            
            // 切换iframe显示
            function switchToFrame(target) {
                // 隐藏当前iframe
                if (currentFrame) {
                    currentFrame.classList.add('hidden-iframe');
                }
                
                // 显示目标iframe
                const targetFrame = frameMap[target];
                if (targetFrame) {
                    // 如果iframe还没有src，设置它
                    if (!targetFrame.src || targetFrame.src === '') {
                        targetFrame.src = target;
                    }
                    
                    targetFrame.classList.remove('hidden-iframe');
                    currentFrame = targetFrame;
                    
                    // 触发iframe的load事件（如果需要）
                    if (targetFrame.contentDocument) {
                        targetFrame.contentWindow.dispatchEvent(new Event('resize'));
                    }
                }
            }
            
            // 更新页面标题
            function updatePageTitle(target) {
                const titles = {
                    'intro.html': '工具箱简介',
                    'rankings.html': '创作者排行榜',
                    'wiki.html': '雅圈大事祭',
                    'coming.html': '敬请期待'
                };
                const title = titles[target] || '雅圈工具箱';
                document.title = `${title} - 雅圈工具箱`;
            }
            
            // 所有iframe的加载处理
            [frameRankings, frameIntro, frameComing].forEach(frame => {
                frame.addEventListener('load', function() {
                    try {
                        // 尝试调整iframe内容以适应移动端
                        const iframeDoc = frame.contentDocument || frame.contentWindow.document;
                        if (iframeDoc && iframeDoc.body) {
                            // 给iframe中的body添加标识类
                            iframeDoc.body.classList.add('in-toolbox');
                            
                            // 调整iframe内部内容的间距
                            const style = document.createElement('style');
                            style.textContent = `
                                body.in-toolbox {
                                    padding-top: 0 !important;
                                }
                                body.in-toolbox .header-banner {
                                    margin-top: 0;
                                    border-radius: 0;
                                }
                                body.in-toolbox .container {
                                    padding: 15px;
                                }
                                @media (max-width: 768px) {
                                    body.in-toolbox .container {
                                        padding: 10px;
                                    }
                                    body.in-toolbox .charts-container {
                                        grid-template-columns: 1fr;
                                        gap: 15px;
                                    }
                                    body.in-toolbox .chart {
                                        height: 300px;
                                    }
                                }
                            `;
                            iframeDoc.head.appendChild(style);
                        }
                    } catch (e) {
                        // 跨域限制，无法访问iframe内容
                    }
                });
            });
            
            // 初始状态
            updatePageTitle('rankings.html');
            
            // 监听窗口大小变化
            window.addEventListener('resize', function() {
                // 如果窗口变大且菜单是打开的，自动关闭移动菜单
                if (window.innerWidth > 768 && sidebar.classList.contains('active')) {
                    toggleMobileMenu();
                }
            });
            
            // 阻止iframe内链接跳出（为所有iframe添加）
            [frameRankings, frameIntro, frameWiki,frameComing].forEach(frame => {
                frame.addEventListener('load', function() {
                    try {
                        const iframeWindow = frame.contentWindow;
                        iframeWindow.addEventListener('click', function(e) {
                            if (e.target.tagName === 'A' && e.target.href) {
                                const href = e.target.href;
                                // 如果是站内链接，在当前iframe内加载
                                if (href.includes(window.location.hostname) || 
                                    href.startsWith('/') || 
                                    href.startsWith('./') || 
                                    href.startsWith('../')) {
                                    e.preventDefault();
                                    frame.src = href;
                                }
                            }
                        }, true);
                    } catch (e) {
                        // 跨域限制，无法访问iframe内容
                    }
                });
            });
        });
    </script>
</body>
</html>
