<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>雅圈大事祭（公测）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .wiki-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .wiki-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .wiki-header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3em;
            margin-bottom: 15px;
        }

        .wiki-header p {
            color: #666;
            font-size: 1.2em;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 热门词条轮播图 */
        .hot-carousel {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .hot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .hot-header h2 {
            font-size: 1.5em;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hot-header h2::before {
            content: "🔥";
            font-size: 1.3em;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 15px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .carousel-slide {
            flex: 0 0 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea10, #764ba210);
            border-radius: 15px;
            border: 1px solid #667eea30;
        }

        .rank-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 15px;
            color: white;
        }

        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #B87333); }

        .slide-title {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .slide-category {
            font-size: 0.5em;
            padding: 4px 12px;
            border-radius: 20px;
            background: white;
        }

        .slide-preview {
            color: #4a5568;
            margin-bottom: 15px;
            line-height: 1.6;
            max-height: 80px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .slide-stats {
            display: flex;
            gap: 20px;
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .slide-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .slide-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator.active {
            background: #667eea;
            transform: scale(1.3);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .carousel-btn:hover {
            background: #667eea;
            color: white;
        }

        .carousel-btn.prev { left: 20px; }
        .carousel-btn.next { right: 20px; }

        /* 控制面板 */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 18px;
        }

        .create-btn, .nickname-btn {
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .create-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .nickname-btn {
            background: #2d3748;
            border: 1px solid #4a5568;
        }
        .nickname-btn:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .current-nickname-tip {
            font-size: 14px;
            background: #edf2f7;
            padding: 6px 14px;
            border-radius: 40px;
            color: #2d3748;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #cbd5e0;
            white-space: nowrap;
        }
        .current-nickname-tip span {
            font-weight: 600;
            color: #667eea;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 分类筛选 */
        .category-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 12px 25px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            color: #495057;
        }

        .category-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        /* 主内容网格 - 词条列表 + 贡献者排行榜 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
        }

        .entries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .entry-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .entry-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .entry-category {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-名人 {
            background: rgba(255, 193, 7, 0.15);
            color: #e6b400;
        }

        .category-事件 {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }

        .entry-title {
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 12px;
            color: #2d3748;
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .entry-preview {
            color: #718096;
            font-size: 0.95em;
            margin-bottom: 20px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: #a0aec0;
            padding-top: 15px;
            border-top: 1px solid #f1f3f9;
        }

        .entry-stats {
            display: flex;
            gap: 15px;
        }

        .entry-version-badge {
            background: #e9ecef;
            color: #495057;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        /* 贡献者排行榜侧边栏 */
        .leaderboard-sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            height: fit-content;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .leaderboard-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f3f9;
        }

        .leaderboard-header h3 {
            font-size: 1.3em;
            color: #2d3748;
        }

        .leaderboard-header .icon {
            font-size: 1.5em;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .leaderboard-item:hover {
            background: #f8f9fa;
            transform: translateX(5px);
        }

        .rank-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1em;
        }

        .rank-1-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
        }

        .rank-2-badge {
            background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
            color: white;
        }

        .rank-3-badge {
            background: linear-gradient(135deg, #CD7F32, #B87333);
            color: white;
        }

        .rank-other {
            background: #e9ecef;
            color: #4a5568;
        }

        .user-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .user-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
            background: #667eea20;
            color: #667eea;
        }

        .user-stats {
            font-size: 13px;
            color: #718096;
        }

        .user-contributions {
            font-weight: 600;
            color: #667eea;
            font-size: 1.1em;
        }

        .my-rank {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #e9ecef;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .my-rank-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2em;
        }

        .my-rank-info {
            flex: 1;
        }

        .my-rank-label {
            font-size: 13px;
            color: #718096;
        }

        .my-rank-value {
            font-weight: 700;
            color: #2d3748;
        }

        /* 模态框样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            color: #2d3748;
            font-size: 1.8em;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #adb5bd;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #f8f9fa;
            color: #495057;
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            max-height: calc(90vh - 140px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.6;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border-color: #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        /* 详情页样式 */
        .entry-detail {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .entry-detail-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .entry-detail-category {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .entry-detail-title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .version-tag {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 0.4em;
            font-weight: 500;
        }

        .entry-detail-meta {
            display: flex;
            gap: 20px;
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .entry-detail-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #2d3748;
        }

        .entry-detail-content h2 {
            margin: 30px 0 15px 0;
            color: #2d3748;
            font-size: 1.5em;
        }

        .entry-detail-content h3 {
            margin: 25px 0 12px 0;
            color: #2d3748;
            font-size: 1.3em;
        }

        .entry-detail-content p {
            margin-bottom: 20px;
        }

        .entry-detail-content ul,
        .entry-detail-content ol {
            margin-left: 30px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #f8f9fa;
            color: #495057;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #e9ecef;
        }

        .edit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .history-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-top: 30px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .history-header h3 {
            color: #2d3748;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item {
            padding: 20px;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .history-item.current {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            border-color: #667eea;
            border-width: 2px;
        }

        .version-number {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .version-editor-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .version-preview {
            color: #718096;
            font-size: 0.95em;
            margin: 12px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .version-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .version-btn {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e9ecef;
            background: white;
            color: #495057;
        }

        .version-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* 提示框 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 2000;
            animation: slideIn 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .toast.error {
            border-left-color: #e53e3e;
        }

        .toast.success {
            border-left-color: #38a169;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 加载动画 */
        .loading {

    <script>
        const SUPABASE_URL = 'https://pwluzvlyglcfdparnavw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bHV6dmx5Z2xjZmRwYXJuYXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4OTUzNDIsImV4cCI6MjA3NDQ3MTM0Mn0.9eF5KQsiRrsun8wD3EZ5SAAmLtY3FO6byJhivT_Vxys';

        class WikiSystem {
            constructor() {
                this.currentView = 'list';
                this.currentCategory = 'all';
                this.currentRootId = null;
                this.currentEntryData = null;
                this.allVersions = [];
                this.searchDebounceTimer = null;
                this.carouselInterval = null;
                this.currentSlide = 0;
                this.hotEntries = [];
                this.currentUsername = this.loadOrPromptNickname();
                this.init();
            }

            init() {
                this.bindEvents();
                this.loadEntries();
                this.loadLeaderboard();
                this.updateNicknameDisplay();
            }

            bindEvents() {
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    clearTimeout(this.searchDebounceTimer);
                    this.searchDebounceTimer = setTimeout(() => {
                        this.searchEntries(e.target.value);
                    }, 300);
                });

                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.currentCategory = e.target.dataset.category;
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.loadEntries();
                    });
                });

                document.getElementById('createEntryBtn').addEventListener('click', () => {
                    this.openCreateModal();
                });

                document.getElementById('backToListBtn').addEventListener('click', () => {
                    this.showListView();
                });

                document.getElementById('modalCloseBtn').addEventListener('click', () => this.closeModal());
                document.getElementById('modalCancelBtn').addEventListener('click', () => this.closeModal());
                document.getElementById('modalSaveBtn').addEventListener('click', () => this.saveEntry());

                document.getElementById('entryModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('entryModal')) {
                        this.closeModal();
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeModal();
                    }
                });

                document.getElementById('nicknameSettingBtn').addEventListener('click', () => this.openNicknameModal());
                document.getElementById('nicknameModalClose').addEventListener('click', () => this.closeNicknameModal());
                document.getElementById('nicknameCancelBtn').addEventListener('click', () => this.closeNicknameModal());
                document.getElementById('nicknameSaveBtn').addEventListener('click', () => this.saveNickname());
                document.getElementById('nicknameModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('nicknameModal')) {
                        this.closeNicknameModal();
                    }
                });
            }

            loadOrPromptNickname() {
                let stored = localStorage.getItem('wiki_username');
                if (stored && stored.trim() !== '') {
                    return stored;
                }
                const defaultName = '热心网友';
                localStorage.setItem('wiki_username', defaultName);
                setTimeout(() => {
                    this.openNicknameModal(true);
                }, 100);
                return defaultName;
            }

            updateNicknameDisplay() {
                const span = document.getElementById('nicknameSpan');
                if (span) span.textContent = this.currentUsername;
            }

            openNicknameModal(force = false) {
                const input = document.getElementById('nicknameInput');
                input.value = this.currentUsername;
                document.getElementById('nicknameModal').classList.add('active');
                if (force) {
                }
                input.focus();
            }

            closeNicknameModal() {
                document.getElementById('nicknameModal').classList.remove('active');
            }

            saveNickname() {
                const input = document.getElementById('nicknameInput');
                const newName = input.value.trim();
                if (!newName) {
                    this.showToast('昵称不能为空', 'error');
                    return;
                }
                if (newName.length > 30) {
                    this.showToast('昵称不能超过30个字符', 'error');
                    return;
                }
                this.currentUsername = newName;
                localStorage.setItem('wiki_username', newName);
                this.updateNicknameDisplay();
                this.closeNicknameModal();
                this.showToast(`昵称已修改为「${newName}」`, 'success');
                this.loadLeaderboard(); // 刷新排行榜
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }

            showConfirm(title, message) {
                return new Promise((resolve) => {
                    const dialog = document.createElement('div');
                    dialog.className = 'confirm-dialog';
                    dialog.innerHTML = `
                        <h3>${title}</h3>
                        <p>${message}</p>
                        <div class="buttons">
                            <button class="btn btn-secondary" id="confirmCancel">取消</button>
                            <button class="btn btn-primary" id="confirmOk">确定</button>
                        </div>
                    `;

                    const overlay = document.createElement('div');
                    overlay.className = 'modal-overlay active';
                    overlay.appendChild(dialog);
                    document.body.appendChild(overlay);

                    document.getElementById('confirmOk').addEventListener('click', () => {
                        document.body.removeChild(overlay);
                        resolve(true);
                    });

                    document.getElementById('confirmCancel').addEventListener('click', () => {
                        document.body.removeChild(overlay);
                        resolve(false);
                    });

                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) {
                            document.body.removeChild(overlay);
                            resolve(false);
                        }
                    });
                });
            }

            // 加载热门词条（按词条总浏览量排序）
            async loadHotEntries() {
                try {
                    // 获取所有根词条
                    const rootResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=id&is_deleted=eq.false&previous_version_id=is.null`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (rootResponse.ok) {
                        const roots = await rootResponse.json();
                        
                        // 计算每个词条的总浏览量
                        const entryStats = [];
                        
                        for (const root of roots) {
                            // 获取该词条的所有版本
                            const versionsResponse = await fetch(
                                `${SUPABASE_URL}/rest/v1/wiki_entries?select=views,version,title,category,content,created_at,updated_at,id&or=(id.eq.${root.id},previous_version_id.eq.${root.id})`,
                                {
                                    headers: {
                                        'apikey': SUPABASE_KEY,
                                        'Authorization': `Bearer ${SUPABASE_KEY}`
                                    }
                                }
                            );
                            
                            if (versionsResponse.ok) {
                                const versions = await versionsResponse.json();
                                
                                // 计算总浏览量
                                const totalViews = versions.reduce((sum, v) => sum + (v.views || 0), 0);
                                
                                // 获取最新版本（用于显示）
                                const latestVersion = versions.sort((a, b) => (b.version || 1) - (a.version || 1))[0];
                                
                                if (latestVersion) {
                                    entryStats.push({
                                        ...latestVersion,
                                        totalViews: totalViews
                                    });
                                }
                            }
                        }
                        
                        // 按总浏览量排序取前3
                        const sorted = entryStats.sort((a, b) => b.totalViews - a.totalViews).slice(0, 3);
                        
                        if (sorted.length > 0) {
                            this.hotEntries = sorted;
                            document.getElementById('hotCarousel').style.display = 'block';
                            this.renderCarousel();
                            this.startCarousel();
                        } else {
                            document.getElementById('hotCarousel').style.display = 'none';
                        }
                    }
                } catch (error) {
                    console.error('加载热门词条失败:', error);
                    document.getElementById('hotCarousel').style.display = 'none';
                }
            }

            // 渲染轮播图
            renderCarousel() {
                const track = document.getElementById('carouselTrack');
                const indicators = document.getElementById('carouselIndicators');
                
                track.innerHTML = this.hotEntries.map((entry, index) => {
                    const rootId = entry.previous_version_id || entry.id;
                    return `
                        <div class="carousel-slide">
                            <div class="rank-badge rank-${index + 1}">第 ${index + 1} 名</div>
                            <h3 class="slide-title">
                                ${this.escapeHtml(entry.title)}
                                <span class="slide-category category-${entry.category}">${entry.category}</span>
                            </h3>
                            <div class="slide-preview">${this.truncateText(this.escapeHtml(entry.content), 120)}</div>
                            <div class="slide-stats">
                                <span>👁 总浏览 ${entry.totalViews} 次</span>
                                <span>📅 ${new Date(entry.updated_at).toLocaleDateString()}</span>
                            </div>
                            <button class="slide-btn" onclick="wiki.showEntryDetail('${rootId}')">
                                查看详情 →
                            </button>
                        </div>
                    `;
                }).join('');

                indicators.innerHTML = this.hotEntries.map((_, index) => `
                    <div class="indicator ${index === 0 ? 'active' : ''}" onclick="wiki.goToSlide(${index})"></div>
                `).join('');
            }

            // 轮播图控制
            startCarousel() {
                if (this.carouselInterval) {
                    clearInterval(this.carouselInterval);
                }
                this.carouselInterval = setInterval(() => {
                    this.nextSlide();
                }, 5000);
            }

            prevSlide() {
                this.currentSlide = (this.currentSlide - 1 + this.hotEntries.length) % this.hotEntries.length;
                this.updateCarousel();
            }

            nextSlide() {
                this.currentSlide = (this.currentSlide + 1) % this.hotEntries.length;
                this.updateCarousel();
            }

            goToSlide(index) {
                this.currentSlide = index;
                this.updateCarousel();
            }

            updateCarousel() {
                const track = document.getElementById('carouselTrack');
                const indicators = document.querySelectorAll('.indicator');
                
                track.style.transform = `translateX(-${this.currentSlide * 100}%)`;
                
                indicators.forEach((ind, index) => {
                    if (index === this.currentSlide) {
                        ind.classList.add('active');
                    } else {
                        ind.classList.remove('active');
                    }
                });
            }

            // 加载贡献者排行榜（屏蔽匿名用户）
            async loadLeaderboard() {
                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=created_by`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (response.ok) {
                        const entries = await response.json();
                        
                        // 统计每个用户的贡献次数，屏蔽匿名用户（created_by为null或'匿名用户'）
                        const stats = {};
                        entries.forEach(e => {
                            const user = e.created_by;
                            // 屏蔽匿名用户：排除null、undefined、'匿名用户'、'热心网友'
                            if (user && user !== '匿名用户' && user !== '热心网友' && user.trim() !== '') {
                                stats[user] = (stats[user] || 0) + 1;
                            }
                        });
                        
                        // 排序
                        const sorted = Object.entries(stats)
                            .map(([user, count]) => ({ user, count }))
                            .sort((a, b) => b.count - a.count)
                            .slice(0, 10); // 取前10名
                        
                        this.renderLeaderboard(sorted, stats);
                    }
                } catch (error) {
                    console.error('加载排行榜失败:', error);
                }
            }

            // 渲染排行榜
            renderLeaderboard(leaderboard, allStats) {
                const list = document.getElementById('leaderboardList');
                
                if (leaderboard.length === 0) {
                    list.innerHTML = `
                        <div style="text-align: center; padding: 30px; color: #718096;">
                            <span style="font-size: 48px; display: block; margin-bottom: 10px;">🏆</span>
                            <p>暂无贡献者</p>
                            <p style="font-size: 13px;">快来创建第一个词条吧！</p>
                        </div>
                    `;
                } else {
                    list.innerHTML = leaderboard.map((item, index) => {
                        const rankClass = index < 3 ? `rank-${index + 1}-badge` : 'rank-other';
                        const badge = index === 0 ? '👑' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : ''));
                        
                        return `
                            <div class="leaderboard-item">
                                <div class="rank-number ${rankClass}">${index + 1}</div>
                                <div class="user-info">
                                    <div class="user-name">
                                        ${this.escapeHtml(item.user)}
                                        ${badge ? `<span class="user-badge">${badge}</span>` : ''}
                                    </div>
                                    <div class="user-stats">贡献了 ${item.count} 个版本</div>
                                </div>
                                <div class="user-contributions">${item.count}</div>
                            </div>
                        `;
                    }).join('');
                }

                // 显示当前用户的排名（只统计非匿名用户）
                const myRank = leaderboard.findIndex(item => item.user === this.currentUsername);
                const myRankDiv = document.getElementById('myRank');
                const myContributions = allStats[this.currentUsername] || 0;
                
                if (myRank !== -1) {
                    document.getElementById('myRankBadge').textContent = myRank + 1;
                    document.getElementById('myRankValue').textContent = `第 ${myRank + 1} 名`;
                    document.getElementById('myContributions').textContent = myContributions;
                    myRankDiv.style.display = 'flex';
                } else {
                    document.getElementById('myRankBadge').textContent = '-';
                    document.getElementById('myRankValue').textContent = '未上榜';
                    document.getElementById('myContributions').textContent = myContributions;
                    myRankDiv.style.display = 'flex';
                }
            }

            async loadEntries() {
                const grid = document.getElementById('entriesGrid');
                grid.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>加载词条中...</p>
                    </div>
                `;

                try {
                    // 先获取所有根词条（没有 previous_version_id 的）
                    let rootUrl = `${SUPABASE_URL}/rest/v1/wiki_entries?select=id&is_deleted=eq.false&previous_version_id=is.null`;
                    
                    if (this.currentCategory !== 'all') {
                        rootUrl += `&category=eq.${this.currentCategory}`;
                    }

                    const rootResponse = await fetch(rootUrl, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });

                    if (rootResponse.ok) {
                        const roots = await rootResponse.json();
                        
                        // 对每个根词条，获取其最新版本
                        const entries = [];
                        for (const root of roots) {
                            const versionsResponse = await fetch(
                                `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&or=(id.eq.${root.id},previous_version_id.eq.${root.id})&order=version.desc`,
                                {
                                    headers: {
                                        'apikey': SUPABASE_KEY,
                                        'Authorization': `Bearer ${SUPABASE_KEY}`
                                    }
                                }
                            );
                            
                            if (versionsResponse.ok) {
                                const versions = await versionsResponse.json();
                                const latestVersion = versions.sort((a, b) => (b.version || 1) - (a.version || 1))[0];
                                if (latestVersion) {
                                    entries.push(latestVersion);
                                }
                            }
                        }
                        
                        // 按更新时间排序
                        entries.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                        this.renderEntries(entries);
                        
                        // 加载热门词条（在加载词条后调用）
                        this.loadHotEntries();
                    } else {
                        throw new Error('加载失败');
                    }
                } catch (error) {
                    grid.innerHTML = '<div class="loading"><p>加载失败，请刷新重试</p></div>';
                    this.showToast('加载失败，请检查网络连接', 'error');
                    console.error('加载词条失败:', error);
                }
            }

            renderEntries(entries) {
                const grid = document.getElementById('entriesGrid');
                
                if (entries.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="emoji">📝</div>
                            <h3>暂无词条</h3>
                            <p>还没有任何词条，快来创建第一个词条吧！</p>
                            <button class="create-btn" onclick="wiki.openCreateModal()">
                                ✏️ 创建新词条
                            </button>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = entries.map(entry => {
                    const rootId = entry.previous_version_id ? entry.previous_version_id : entry.id;
                    return `
                        <div class="entry-card" data-root-id="${rootId}">
                            <div class="entry-category category-${entry.category}">
                                ${entry.category}
                            </div>
                            <h3 class="entry-title">
                                ${this.escapeHtml(entry.title)}
                                <span class="entry-version-badge">v${entry.version || 1}</span>
                            </h3>
                            <div class="entry-preview">${this.truncateText(this.escapeHtml(entry.content), 150)}</div>
                            <div class="entry-footer">
                                <div class="entry-stats">
                                    <span>👁 ${entry.views || 0}</span>
                                    <span>📅 ${new Date(entry.updated_at).toLocaleDateString()}</span>
                                </div>
                                <span>✍ ${this.escapeHtml(entry.created_by || '匿名用户')}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                grid.querySelectorAll('.entry-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        const rootId = e.currentTarget.dataset.rootId;
                        this.showEntryDetail(rootId);
                    });
                });
            }

            async searchEntries(keyword) {
                if (!keyword.trim()) {
                    this.loadEntries();
                    return;
                }

                try {
                    const rootResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=id&is_deleted=eq.false&previous_version_id=is.null&title=ilike.%25${encodeURIComponent(keyword)}%25`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (rootResponse.ok) {
                        const roots = await rootResponse.json();
                        
                        const entries = [];
                        for (const root of roots) {
                            const versionsResponse = await fetch(
                                `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&or=(id.eq.${root.id},previous_version_id.eq.${root.id})&order=version.desc`,
                                {
                                    headers: {
                                        'apikey': SUPABASE_KEY,
                                        'Authorization': `Bearer ${SUPABASE_KEY}`
                                    }
                                }
                            );
                            
                            if (versionsResponse.ok) {
                                const versions = await versionsResponse.json();
                                const latestVersion = versions.sort((a, b) => (b.version || 1) - (a.version || 1))[0];
                                if (latestVersion) {
                                    entries.push(latestVersion);
                                }
                            }
                        }
                        
                        this.renderEntries(entries);
                    }
                } catch (error) {
                    console.error('搜索失败:', error);
                    this.showToast('搜索失败，请重试', 'error');
                }
            }

            async showEntryDetail(rootId) {
                this.currentRootId = rootId;
                this.currentView = 'detail';
                
                document.getElementById('listView').style.display = 'none';
                document.getElementById('detailView').style.display = 'block';

                const detailDiv = document.getElementById('entryDetail');
                detailDiv.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>加载词条详情...</p>
                    </div>
                `;

                try {
                    await this.loadAllVersions(rootId);
                    
                    const latestVersion = this.getLatestVersion();
                    
                    if (latestVersion) {
                        await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries?id=eq.${latestVersion.id}`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify({
                                views: (latestVersion.views || 0) + 1
                            })
                        });

                        this.displayVersion(latestVersion);
                        
                        // 刷新热门词条和排行榜
                        this.loadHotEntries();
                        this.loadLeaderboard();
                    }
                } catch (error) {
                    detailDiv.innerHTML = '<p class="loading">加载失败，请刷新重试</p>';
                    this.showToast('加载详情失败', 'error');
                    console.error('加载详情失败:', error);
                }
            }

            async loadAllVersions(rootId) {
                try {
                    this.allVersions = [];
                    
                    const rootResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&id=eq.${rootId}`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );
                    
                    if (rootResponse.ok) {
                        const [root] = await rootResponse.json();
                        if (root) {
                            this.allVersions.push(root);
                        }
                        
                        const versionsResponse = await fetch(
                            `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&previous_version_id=eq.${rootId}&order=version.desc`,
                            {
                                headers: {
                                    'apikey': SUPABASE_KEY,
                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                }
                            }
                        );
                        
                        if (versionsResponse.ok) {
                            const versions = await versionsResponse.json();
                            this.allVersions = [...this.allVersions, ...versions];
                        }
                    }
                } catch (error) {
                    console.error('加载版本失败:', error);
                }
            }

            getLatestVersion() {
                if (this.allVersions.length === 0) return null;
                return [...this.allVersions].sort((a, b) => {
                    if (a.version && b.version) {
                        return b.version - a.version;
                    }
                    return new Date(b.created_at) - new Date(a.created_at);
                })[0];
            }

            displayVersion(version) {
                this.currentEntryData = version;
                
                const detailDiv = document.getElementById('entryDetail');
                
                detailDiv.innerHTML = `
                    <div class="entry-detail-header">
                        <div class="entry-detail-category category-${version.category}">
                            ${version.category}
                        </div>
                        <h1 class="entry-detail-title">
                            ${this.escapeHtml(version.title)}
                            <span class="version-tag">版本 ${version.version || 1}</span>
                        </h1>
                        <div class="entry-detail-meta">
                            <span>✍ 编辑者：${this.escapeHtml(version.created_by || '匿名用户')}</span>
                            <span>📅 编辑时间：${new Date(version.created_at).toLocaleString()}</span>
                            <span>🔄 最后更新：${new Date(version.updated_at).toLocaleString()}</span>
                            <span>👁 浏览次数：${(version.views || 0)}</span>
                        </div>
                        ${version.edit_comment ? `
                            <div style="margin-top: 15px; padding: 12px; background: #f8f9fa; border-radius: 8px; border-left: 3px solid #667eea;">
                                <strong>📝 编辑备注：</strong> ${this.escapeHtml(version.edit_comment)}
                            </div>
                        ` : ''}
                    </div>
                    <div class="entry-detail-content">
                        ${this.formatContent(version.content)}
                    </div>
                    <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: flex-end;">
                        <button class="edit-btn" onclick="wiki.openEditModal()">
                            ✏️ 编辑此词条
                        </button>
                    </div>
                `;

                this.renderVersionHistory();
            }

            renderVersionHistory() {
                const historySection = document.getElementById('historySection');
                
                if (this.allVersions.length <= 1) {
                    historySection.style.display = 'none';
                    return;
                }
                
                const sortedVersions = [...this.allVersions].sort((a, b) => {
                    if (a.version && b.version) {
                        return b.version - a.version;
                    }
                    return new Date(b.created_at) - new Date(a.created_at);
                });

                const latestVersion = sortedVersions[0];
                const currentVersionId = this.currentEntryData?.id;

                historySection.style.display = 'block';
                historySection.innerHTML = `
                    <div class="history-header">
                        <h3>📜 历史版本 (共 ${this.allVersions.length} 个版本)</h3>
                        <span class="history-stats">当前显示版本 ${this.currentEntryData?.version || 1}</span>
                    </div>
                    <div class="versions-list">
                        ${sortedVersions.map((version) => {
                            const isCurrent = version.id === currentVersionId;
                            const isLatest = version.id === latestVersion.id;
                            const isRoot = version.id === this.currentRootId;
                            return `
                                <div class="history-item ${isCurrent ? 'current' : ''}" data-version-id="${version.id}">
                                    <div class="history-item-header">
                                        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                            <span class="version-number">版本 ${version.version || '?'}</span>
                                            ${isRoot ? '<span style="color: #e53e3e; font-size: 0.85em;">初始版本</span>' : ''}
                                            ${isCurrent ? '<span style="color: #667eea; font-size: 0.85em;">当前显示</span>' : ''}
                                            ${isLatest ? '<span style="color: #38a169; font-size: 0.85em;">最新版本</span>' : ''}
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                                            <span class="version-editor">
                                                <span class="version-editor-icon">
                                                    ${(version.created_by || '匿名用户').charAt(0)}
                                                </span>
                                                ${this.escapeHtml(version.created_by || '匿名用户')}
                                            </span>
                                            <span class="version-date">
                                                📅 ${new Date(version.created_at).toLocaleString()}
                                            </span>
                                        </div>
                                    </div>
                                    ${version.edit_comment ? `
                                        <div class="version-preview" style="border-left-color: #38a169;">
                                            💬 ${this.escapeHtml(version.edit_comment)}
                                        </div>
                                    ` : ''}
                                    <div class="version-preview">
                                        ${this.truncateText(this.escapeHtml(version.content), 150)}
                                    </div>
                                    <div class="version-actions">
                                        <button class="version-btn view" onclick="wiki.viewVersion('${version.id}')">
                                            👁️ 查看完整内容
                                        </button>
                                        ${version.id !== latestVersion.id ? `
                                            <button class="version-btn restore" onclick="wiki.showRestoreConfirm('${version.id}')">
                                                ↩️ 恢复到此版本
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            async viewVersion(versionId) {
                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&id=eq.${versionId}`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (response.ok) {
                        const [version] = await response.json();
                        
                        const modalHtml = `
                            <div class="modal-overlay active" id="versionModal" style="display: flex;">
                                <div class="modal" style="max-width: 700px;">
                                    <div class="modal-header">
                                        <h2>版本 ${version.version || '?'} - ${this.escapeHtml(version.title)}</h2>
                                        <button class="modal-close" onclick="document.getElementById('versionModal').remove()">×</button>
                                    </div>
                                    <div class="modal-body">
                                        <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                                            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px;">
                                                <span>✍ 编辑者：${this.escapeHtml(version.created_by || '匿名用户')}</span>
                                                <span>📅 时间：${new Date(version.created_at).toLocaleString()}</span>
                                            </div>
                                            ${version.edit_comment ? `
                                                <div style="margin-top: 10px; padding: 10px; background: white; border-radius: 8px;">
                                                    <strong>编辑备注：</strong> ${this.escapeHtml(version.edit_comment)}
                                                </div>
                                            ` : ''}
                                        </div>
                                        <div style="max-height: 400px; overflow-y: auto; padding: 20px; background: white; border: 1px solid #e9ecef; border-radius: 10px;">
                                            ${this.formatContent(version.content)}
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('versionModal').remove()">关闭</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        
                        document.body.insertAdjacentHTML('beforeend', modalHtml);
                        
                        const versionModal = document.getElementById('versionModal');
                        versionModal.addEventListener('click', (e) => {
                            if (e.target === versionModal) {
                                versionModal.remove();
                            }
                        });
                    }
                } catch (error) {
                    console.error('加载版本失败:', error);
                    this.showToast('加载版本失败', 'error');
                }
            }

            async showRestoreConfirm(versionId) {
                const confirmed = await this.showConfirm('确认恢复', '确定要恢复到这个历史版本吗？这将创建一个新版本。');
                
                if (confirmed) {
                    await this.restoreVersion(versionId);
                }
            }

            async restoreVersion(versionId) {
                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&id=eq.${versionId}`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (response.ok) {
                        const [versionToRestore] = await response.json();
                        
                        await this.loadAllVersions(this.currentRootId);
                        
                        const maxVersion = Math.max(...this.allVersions.map(v => v.version || 0));
                        const newVersion = maxVersion + 1;
                        
                        const createResponse = await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            },
                            body: JSON.stringify({
                                title: versionToRestore.title,
                                category: versionToRestore.category,
                                content: versionToRestore.content,
                                created_by: this.currentUsername,
                                edit_comment: `恢复到版本 ${versionToRestore.version || '?'}`,
                                previous_version_id: this.currentRootId,
                                version: newVersion
                            })
                        });

                        if (!createResponse.ok) {
                            throw new Error('创建新版本失败');
                        }

                        this.showToast('版本恢复成功！新版本已创建');
                        
                        await this.showEntryDetail(this.currentRootId);
                        
                        const versionModal = document.getElementById('versionModal');
                        if (versionModal) {
                            versionModal.remove();
                        }
                        
                        // 刷新排行榜
                        this.loadLeaderboard();
                    }
                } catch (error) {
                    console.error('恢复版本失败:', error);
                    this.showToast('恢复版本失败: ' + error.message, 'error');
                }
            }

            showListView() {
                this.currentView = 'list';
                this.currentRootId = null;
                this.currentEntryData = null;
                this.allVersions = [];
                
                document.getElementById('detailView').style.display = 'none';
                document.getElementById('listView').style.display = 'block';
                document.getElementById('historySection').style.display = 'none';
                
                this.loadEntries();
                this.loadLeaderboard();
            }

            openCreateModal() {
                document.getElementById('modalTitle').textContent = '创建新词条';
                document.getElementById('entryForm').reset();
                document.getElementById('editComment').value = '';
                this.currentRootId = null;
                document.getElementById('entryModal').classList.add('active');
                document.getElementById('entryTitle').focus();
            }

            openEditModal() {
                const latestVersion = this.getLatestVersion();
                
                if (latestVersion) {
                    document.getElementById('modalTitle').textContent = '编辑词条';
                    document.getElementById('entryTitle').value = latestVersion.title;
                    document.getElementById('entryCategory').value = latestVersion.category;
                    document.getElementById('entryContent').value = latestVersion.content;
                    document.getElementById('editComment').value = '';
                    
                    document.getElementById('entryModal').classList.add('active');
                    document.getElementById('entryTitle').focus();
                } else {
                    this.showToast('加载词条失败', 'error');
                }
            }

            async saveEntry() {
                const title = document.getElementById('entryTitle').value.trim();
                const category = document.getElementById('entryCategory').value;
                const content = document.getElementById('entryContent').value.trim();
                const editComment = document.getElementById('editComment').value.trim();

                if (!title || !category || !content) {
                    this.showToast('请填写所有必填项', 'error');
                    return;
                }

                if (title.length > 100) {
                    this.showToast('标题不能超过100个字符', 'error');
                    return;
                }

                try {
                    if (this.currentRootId) {
                        await this.loadAllVersions(this.currentRootId);
                        
                        const maxVersion = Math.max(...this.allVersions.map(v => v.version || 0));
                        const newVersion = maxVersion + 1;
                        
                        const createResponse = await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            },
                            body: JSON.stringify({
                                title,
                                category,
                                content,
                                created_by: this.currentUsername,
                                edit_comment: editComment || `版本 ${newVersion}`,
                                previous_version_id: this.currentRootId,
                                version: newVersion
                            })
                        });

                        if (!createResponse.ok) {
                            throw new Error('创建新版本失败');
                        }

                        this.showToast('编辑成功！新版本已创建');
                    } else {
                        const createResponse = await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            },
                            body: JSON.stringify({
                                title,
                                category,
                                content,
                                created_by: this.currentUsername,
                                edit_comment: editComment || '初始版本',
                                version: 1,
                                previous_version_id: null
                            })
                        });

                        if (!createResponse.ok) {
                            throw new Error('创建词条失败');
                        }

                        this.showToast('词条创建成功！');
                    }

                    this.closeModal();
                    this.showListView();
                    
                } catch (error) {
                    console.error('保存词条失败:', error);
                    this.showToast('保存失败: ' + error.message, 'error');
                }
            }

            closeModal() {
                document.getElementById('entryModal').classList.remove('active');
                document.getElementById('entryForm').reset();
            }

            formatContent(content) {
                if (!content) return '';
                
                let html = this.escapeHtml(content);
                
                html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                
                html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
                
                html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
                
                html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                
                const lines = html.split('\n');
                let inList = false;
                let listType = '';
                let processedLines = [];
                
                for (let line of lines) {
                    const olMatch = line.match(/^(\d+)\. (.*)$/);
                    const ulMatch = line.match(/^\* (.*)$/);
                    
                    if (olMatch) {
                        if (!inList || listType !== 'ol') {
                            if (inList) processedLines.push(`</${listType}>`);
                            processedLines.push('<ol>');
                            inList = true;
                            listType = 'ol';
                        }
                        processedLines.push(`<li value="${olMatch[1]}">${olMatch[2]}</li>`);
                    } else if (ulMatch) {
                        if (!inList || listType !== 'ul') {
                            if (inList) processedLines.push(`</${listType}>`);
                            processedLines.push('<ul>');
                            inList = true;
                            listType = 'ul';
                        }
                        processedLines.push(`<li>${ulMatch[1]}</li>`);
                    } else {
                        if (inList) {
                            processedLines.push(`</${listType}>`);
                            inList = false;
                        }
                        processedLines.push(line);
                    }
                }
                if (inList) {
                    processedLines.push(`</${listType}>`);
                }
                
                html = processedLines.join('\n');
                
                const paragraphs = html.split('\n\n');
                html = paragraphs.map(p => {
                    if (p.trim() && !p.startsWith('<')) {
                        return `<p>${p.replace(/\n/g, '<br>')}</p>`;
                    }
                    return p;
                }).join('\n');
                
                return html;
            }

            truncateText(text, length) {
                if (!text) return '';
                if (text.length <= length) return text;
                return text.substr(0, length) + '...';
            }

            escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        const wiki = new WikiSystem();
    </script>
</body>
</html>
