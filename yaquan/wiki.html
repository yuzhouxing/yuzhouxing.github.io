<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅圈维基 - 雅圈工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .wiki-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        .wiki-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .wiki-header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3em;
            margin-bottom: 15px;
        }

        .wiki-header p {
            color: #666;
            font-size: 1.2em;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 控制面板 */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 18px;
        }

        .create-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        /* 分类筛选 */
        .category-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 12px 25px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            color: #495057;
        }

        .category-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        /* 词条网格 */
        .entries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .entry-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .entry-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .entry-category {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-名人 {
            background: rgba(255, 193, 7, 0.15);
            color: #e6b400;
        }

        .category-事件 {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }

        .entry-title {
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 12px;
            color: #2d3748;
            line-height: 1.3;
        }

        .entry-preview {
            color: #718096;
            font-size: 0.95em;
            margin-bottom: 20px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: #a0aec0;
            padding-top: 15px;
            border-top: 1px solid #f1f3f9;
        }

        .entry-stats {
            display: flex;
            gap: 15px;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            color: #2d3748;
            font-size: 1.8em;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #adb5bd;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #f8f9fa;
            color: #495057;
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            max-height: calc(90vh - 140px);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.6;
        }

        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            min-height: 56px;
            align-items: center;
        }

        .tag-input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 100px;
            font-size: 16px;
            font-family: inherit;
        }

        .tag {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-remove {
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border-color: #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        /* 词条详情页 */
        .entry-detail {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .entry-detail-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .entry-detail-category {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .entry-detail-title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
            line-height: 1.2;
        }

        .entry-detail-meta {
            display: flex;
            gap: 20px;
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .entry-detail-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #2d3748;
        }

        .entry-detail-content h2 {
            margin: 30px 0 15px 0;
            color: #2d3748;
            font-size: 1.5em;
        }

        .entry-detail-content p {
            margin-bottom: 20px;
        }

        .entry-detail-content ul,
        .entry-detail-content ol {
            margin-left: 30px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #f8f9fa;
            color: #495057;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #e9ecef;
        }

        .edit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        /* 历史版本 */
        .history-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .history-item {
            padding: 20px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .history-item:hover {
            border-color: #667eea;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .wiki-container {
                padding: 15px;
            }

            .wiki-header {
                padding: 20px;
            }

            .wiki-header h1 {
                font-size: 2.2em;
            }

            .control-panel {
                grid-template-columns: 1fr;
            }

            .entries-grid {
                grid-template-columns: 1fr;
            }

            .entry-detail {
                padding: 25px;
            }

            .entry-detail-title {
                font-size: 2em;
            }

            .modal {
                margin: 10px;
            }

            .modal-body {
                padding: 20px;
                max-height: calc(90vh - 120px);
            }
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wiki-container" id="wikiContainer">
        <!-- 列表视图 -->
        <div id="listView">
            <div class="wiki-header">
                <h1>📚 雅圈维基百科</h1>
                <p>记录雅圈的精彩人物与重要事件，共同书写属于我们的历史</p>
            </div>

            <div class="control-panel">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索词条..." autocomplete="off">
                </div>
                <button class="create-btn" id="createEntryBtn">
                    ✏️ 创建新词条
                </button>
            </div>

            <div class="category-filter">
                <button class="category-btn active" data-category="all">全部</button>
                <button class="category-btn" data-category="名人">名人</button>
                <button class="category-btn" data-category="事件">事件</button>
            </div>

            <div class="entries-grid" id="entriesGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载词条中...</p>
                </div>
            </div>
        </div>

        <!-- 详情视图 -->
        <div id="detailView" style="display: none;">
            <button class="back-btn" id="backToListBtn">← 返回词条列表</button>
            <div class="entry-detail" id="entryDetail"></div>
            <div class="history-section" id="historySection" style="display: none;">
                <h3>📜 编辑历史</h3>
                <div id="historyList"></div>
            </div>
        </div>

        <!-- 编辑/创建模态框 -->
        <div class="modal-overlay" id="entryModal">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">创建新词条</h2>
                    <button class="modal-close" id="modalCloseBtn">×</button>
                </div>
                <div class="modal-body">
                    <form id="entryForm">
                        <div class="form-group">
                            <label for="entryTitle">词条标题 *</label>
                            <input type="text" id="entryTitle" required placeholder="请输入词条标题">
                        </div>
                        
                        <div class="form-group">
                            <label for="entryCategory">分类 *</label>
                            <select id="entryCategory" required>
                                <option value="">请选择分类</option>
                                <option value="名人">名人</option>
                                <option value="事件">事件</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="entryTags">标签</label>
                            <div class="tag-input-container" id="tagContainer">
                                <input type="text" id="entryTags" class="tag-input" placeholder="输入标签后按回车">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="entryContent">内容 *</label>
                            <textarea id="entryContent" required placeholder="请输入词条内容（支持Markdown格式）"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="modalCancelBtn">取消</button>
                    <button type="button" class="btn btn-primary" id="modalSaveBtn">保存词条</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const SUPABASE_URL = 'https://pwluzvlyglcfdparnavw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bHV6dmx5Z2xjZmRwYXJuYXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4OTUzNDIsImV4cCI6MjA3NDQ3MTM0Mn0.9eF5KQsiRrsun8wD3EZ5SAAmLtY3FO6byJhivT_Vxys';

        class WikiSystem {
            constructor() {
                this.currentView = 'list';
                this.currentCategory = 'all';
                this.currentEntryId = null;
                this.tags = [];
                this.init();
            }

            init() {
                this.bindEvents();
                this.loadEntries();
            }

            bindEvents() {
                // 搜索
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchEntries(e.target.value);
                });

                // 分类筛选
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.currentCategory = e.target.dataset.category;
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.loadEntries();
                    });
                });

                // 创建按钮
                document.getElementById('createEntryBtn').addEventListener('click', () => {
                    this.openCreateModal();
                });

                // 返回按钮
                document.getElementById('backToListBtn').addEventListener('click', () => {
                    this.showListView();
                });

                // 模态框
                document.getElementById('modalCloseBtn').addEventListener('click', () => this.closeModal());
                document.getElementById('modalCancelBtn').addEventListener('click', () => this.closeModal());
                document.getElementById('modalSaveBtn').addEventListener('click', () => this.saveEntry());

                // 标签输入
                document.getElementById('entryTags').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const tag = e.target.value.trim();
                        if (tag && !this.tags.includes(tag)) {
                            this.addTag(tag);
                            e.target.value = '';
                        }
                    }
                });

                // 点击遮罩关闭模态框
                document.getElementById('entryModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('entryModal')) {
                        this.closeModal();
                    }
                });
            }

            async loadEntries() {
                const grid = document.getElementById('entriesGrid');
                grid.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>加载词条中...</p>
                    </div>
                `;

                try {
                    let url = `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&is_deleted=eq.false&order=updated_at.desc`;
                    
                    if (this.currentCategory !== 'all') {
                        url += `&category=eq.${this.currentCategory}`;
                    }

                    const response = await fetch(url, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });

                    if (response.ok) {
                        const entries = await response.json();
                        this.renderEntries(entries);
                    } else {
                        throw new Error('加载失败');
                    }
                } catch (error) {
                    grid.innerHTML = '<div class="loading"><p>加载失败，请刷新重试</p></div>';
                    console.error('加载词条失败:', error);
                }
            }

            renderEntries(entries) {
                const grid = document.getElementById('entriesGrid');
                
                if (entries.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #718096;">
                            <div style="font-size: 48px; margin-bottom: 20px;">📝</div>
                            <h3 style="margin-bottom: 10px;">暂无词条</h3>
                            <p style="margin-bottom: 30px;">快来创建第一个词条吧！</p>
                            <button class="create-btn" onclick="wiki.openCreateModal()">
                                ✏️ 创建新词条
                            </button>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = entries.map(entry => `
                    <div class="entry-card" data-id="${entry.id}">
                        <div class="entry-category category-${entry.category}">
                            ${entry.category}
                        </div>
                        <h3 class="entry-title">${this.escapeHtml(entry.title)}</h3>
                        <div class="entry-preview">${this.truncateText(this.escapeHtml(entry.content), 150)}</div>
                        <div class="entry-footer">
                            <div class="entry-stats">
                                <span>👁 ${entry.views || 0}</span>
                                <span>📅 ${new Date(entry.updated_at).toLocaleDateString()}</span>
                            </div>
                            <span>✍ ${entry.created_by || '匿名用户'}</span>
                        </div>
                    </div>
                `).join('');

                // 添加点击事件
                grid.querySelectorAll('.entry-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        const id = e.currentTarget.dataset.id;
                        this.showEntryDetail(id);
                    });
                });
            }

            async searchEntries(keyword) {
                if (!keyword.trim()) {
                    this.loadEntries();
                    return;
                }

                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&is_deleted=eq.false&title=ilike.%25${encodeURIComponent(keyword)}%25&order=updated_at.desc`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (response.ok) {
                        const entries = await response.json();
                        this.renderEntries(entries);
                    }
                } catch (error) {
                    console.error('搜索失败:', error);
                }
            }

            async showEntryDetail(id) {
                this.currentEntryId = id;
                this.currentView = 'detail';
                
                document.getElementById('listView').style.display = 'none';
                document.getElementById('detailView').style.display = 'block';

                const detailDiv = document.getElementById('entryDetail');
                detailDiv.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>加载词条详情...</p>
                    </div>
                `;

                try {
                    // 获取词条详情
                    const entryResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&id=eq.${id}`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (entryResponse.ok) {
                        const [entry] = await entryResponse.json();
                        
                        // 增加浏览量
                        await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries?id=eq.${id}`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify({
                                views: (entry.views || 0) + 1,
                                updated_at: new Date().toISOString()
                            })
                        });

                        // 渲染详情
                        detailDiv.innerHTML = `
                            <div class="entry-detail-header">
                                <div class="entry-detail-category category-${entry.category}">
                                    ${entry.category}
                                </div>
                                <h1 class="entry-detail-title">${this.escapeHtml(entry.title)}</h1>
                                <div class="entry-detail-meta">
                                    <span>✍ 创建者：${entry.created_by || '匿名用户'}</span>
                                    <span>📅 创建时间：${new Date(entry.created_at).toLocaleString()}</span>
                                    <span>🔄 最后更新：${new Date(entry.updated_at).toLocaleString()}</span>
                                    <span>👁 浏览次数：${(entry.views || 0) + 1}</span>
                                </div>
                                ${entry.tags && entry.tags.length > 0 ? `
                                    <div style="margin-top: 15px;">
                                        ${entry.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                            <div class="entry-detail-content">
                                ${this.formatContent(entry.content)}
                            </div>
                            <div style="margin-top: 30px;">
                                <button class="edit-btn" onclick="wiki.openEditModal(${entry.id})">
                                    ✏️ 编辑此词条
                                </button>
                            </div>
                        `;

                        // 加载编辑历史
                        this.loadEntryHistory(id);
                    }
                } catch (error) {
                    detailDiv.innerHTML = '<p class="loading">加载失败，请刷新重试</p>';
                    console.error('加载详情失败:', error);
                }
            }

            async loadEntryHistory(id) {
                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/wiki_entries?select=*&previous_version_id=eq.${id}&order=created_at.desc`,
                        {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (response.ok) {
                        const history = await response.json();
                        if (history.length > 0) {
                            document.getElementById('historySection').style.display = 'block';
                            document.getElementById('historyList').innerHTML = history.map(item => `
                                <div class="history-item">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                        <strong>版本 ${item.version}</strong>
                                        <span style="color: #718096; font-size: 0.9em;">
                                            ${new Date(item.created_at).toLocaleString()}
                                        </span>
                                    </div>
                                    <div style="color: #718096; font-size: 0.9em;">
                                        编辑者：${item.created_by || '匿名用户'}
                                    </div>
                                    <div style="margin-top: 10px; color: #495057;">
                                        ${this.truncateText(this.escapeHtml(item.content), 100)}
                                    </div>
                                </div>
                            `).join('');
                        }
                    }
                } catch (error) {
                    console.error('加载历史失败:', error);
                }
            }

            showListView() {
                this.currentView = 'list';
                this.currentEntryId = null;
                
                document.getElementById('detailView').style.display = 'none';
                document.getElementById('listView').style.display = 'block';
                document.getElementById('historySection').style.display = 'none';
                
                this.loadEntries();
            }

            openCreateModal() {
                document.getElementById('modalTitle').textContent = '创建新词条';
                document.getElementById('entryForm').reset();
                this.tags = [];
                this.updateTagDisplay();
                this.currentEntryId = null;
                document.getElementById('entryModal').classList.add('active');
                document.getElementById('entryTitle').focus();
            }

            openEditModal(id) {
                this.currentEntryId = id;
                
                // 加载词条数据
                fetch(`${SUPABASE_URL}/rest/v1/wiki_entries?select=*&id=eq.${id}`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                })
                .then(response => response.json())
                .then(([entry]) => {
                    document.getElementById('modalTitle').textContent = '编辑词条';
                    document.getElementById('entryTitle').value = entry.title;
                    document.getElementById('entryCategory').value = entry.category;
                    document.getElementById('entryContent').value = entry.content;
                    
                    this.tags = entry.tags || [];
                    this.updateTagDisplay();
                    
                    document.getElementById('entryModal').classList.add('active');
                    document.getElementById('entryTitle').focus();
                })
                .catch(error => {
                    console.error('加载词条失败:', error);
                    alert('加载词条失败，请重试');
                });
            }

            async saveEntry() {
                const title = document.getElementById('entryTitle').value.trim();
                const category = document.getElementById('entryCategory').value;
                const content = document.getElementById('entryContent').value.trim();

                if (!title || !category || !content) {
                    alert('请填写所有必填项');
                    return;
                }

                // 生成用户名
                const username = this.getUsername();

                try {
                    if (this.currentEntryId) {
                        // 编辑现有词条
                        const entryResponse = await fetch(
                            `${SUPABASE_URL}/rest/v1/wiki_entries?select=version&id=eq.${this.currentEntryId}`,
                            {
                                headers: {
                                    'apikey': SUPABASE_KEY,
                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                }
                            }
                        );
                        
                        if (entryResponse.ok) {
                            const [currentEntry] = await entryResponse.json();
                            
                            // 创建新版本
                            await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'apikey': SUPABASE_KEY,
                                    'Authorization': `Bearer ${SUPABASE_KEY}`
                                },
                                body: JSON.stringify({
                                    title,
                                    category,
                                    content,
                                    tags: this.tags,
                                    created_by: username,
                                    previous_version_id: this.currentEntryId,
                                    version: (currentEntry.version || 1) + 1
                                })
                            });

                            // 更新原词条为最新状态
                            await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries?id=eq.${this.currentEntryId}`, {
                                method: 'PATCH',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'apikey': SUPABASE_KEY,
                                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                                    'Prefer': 'return=minimal'
                                },
                                body: JSON.stringify({
                                    title,
                                    category,
                                    content,
                                    tags: this.tags,
                                    updated_at: new Date().toISOString(),
                                    views: 0 // 重置浏览量，因为这是新版本
                                })
                            });

                            alert('词条更新成功！');
                        }
                    } else {
                        // 创建新词条
                        await fetch(`${SUPABASE_URL}/rest/v1/wiki_entries`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            },
                            body: JSON.stringify({
                                title,
                                category,
                                content,
                                tags: this.tags,
                                created_by: username
                            })
                        });

                        alert('词条创建成功！');
                    }

                    this.closeModal();
                    this.showListView();
                    
                } catch (error) {
                    console.error('保存词条失败:', error);
                    alert('保存失败，请重试');
                }
            }

            closeModal() {
                document.getElementById('entryModal').classList.remove('active');
                document.getElementById('entryForm').reset();
                this.tags = [];
                this.updateTagDisplay();
            }

            addTag(tag) {
                if (tag && !this.tags.includes(tag)) {
                    this.tags.push(tag);
                    this.updateTagDisplay();
                }
            }

            removeTag(tag) {
                this.tags = this.tags.filter(t => t !== tag);
                this.updateTagDisplay();
            }

            updateTagDisplay() {
                const container = document.getElementById('tagContainer');
                const tagInput = document.getElementById('entryTags');
                
                container.innerHTML = `
                    ${this.tags.map(tag => `
                        <span class="tag">
                            ${tag}
                            <span class="tag-remove" onclick="wiki.removeTag('${tag}')">×</span>
                        </span>
                    `).join('')}
                    <input type="text" id="entryTags" class="tag-input" placeholder="输入标签后按回车">
                `;

                // 重新绑定事件
                document.getElementById('entryTags').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const tag = e.target.value.trim();
                        if (tag && !this.tags.includes(tag)) {
                            this.addTag(tag);
                            e.target.value = '';
                        }
                    }
                });
            }

            getUsername() {
                // 尝试从localStorage获取用户名
                let username = localStorage.getItem('wiki_username');
                if (!username) {
                    // 生成随机用户名
                    const adjectives = ['聪明', '勤奋', '热情', '创意', '细致', '专注', '好奇', '坚持'];
                    const nouns = ['探索者', '创作者', '记录者', '观察者', '思考者', '学习者', '分享者'];
                    const randomAdjective = adjectives[Math.floor(Math.random() * adjectives.length)];
                    const randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
                    const randomNum = Math.floor(Math.random() * 999) + 1;
                    username = `${randomAdjective}的${randomNoun}${randomNum}`;
                    localStorage.setItem('wiki_username', username);
                }
                return username;
            }

            formatContent(content) {
                // 简单的Markdown转换
                return this.escapeHtml(content)
                    .replace(/\n\n+/g, '</p><p>')
                    .replace(/\n/g, '<br>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
                    .replace(/^### (.*?)$/gm, '<h3>$1</h3>')
                    .replace(/^## (.*?)$/gm, '<h2>$1</h2>')
                    .replace(/^# (.*?)$/gm, '<h1>$1</h1>')
                    .replace(/^(\d+)\. (.*?)$/gm, '<li>$2</li>')
                    .replace(/(<li>.*<\/li>)/gs, '<ol>$1</ol>')
                    .replace(/^\* (.*?)$/gm, '<li>$1</li>')
                    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
            }

            truncateText(text, length) {
                if (text.length <= length) return text;
                return text.substr(0, length) + '...';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // 初始化系统
        const wiki = new WikiSystem();
    </script>
</body>
</html>
